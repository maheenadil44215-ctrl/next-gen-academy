<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Next Gen Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  /* Layout: one centered column. Hero = copy + orbit art. Subjects = 2x2 sticker cards, each with its own colour. Single dark theme by design. */
  --bg:#130F26; --card:#221C44; --card-2:#1A1536; --line:#3B3270; --fg:#F5F1FF; --mute:#ABA3D1; --ink:#130F26;
  --computer:#5B8CFF; --chem:#35E0A1; --bio:#FF66B3; --phys:#FFB63D;
  --ac:var(--computer);
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;color:var(--fg);font:400 16px/1.6 var(--f-body);
  background:
    radial-gradient(900px 520px at 6% -4%,color-mix(in srgb,var(--computer) 22%,transparent),transparent 62%),
    radial-gradient(800px 520px at 100% 0%,color-mix(in srgb,var(--bio) 18%,transparent),transparent 62%),
    radial-gradient(900px 600px at 0% 100%,color-mix(in srgb,var(--chem) 14%,transparent),transparent 62%),
    radial-gradient(900px 600px at 100% 100%,color-mix(in srgb,var(--phys) 14%,transparent),transparent 62%),
    var(--bg);
  background-repeat:no-repeat;
}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(1.7rem,4.8vw,3rem);line-height:1.1;font-weight:800}
h2{font-size:clamp(1.15rem,2.6vw,1.5rem);font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.lead{font-size:1.1rem;color:var(--mute);max-width:60ch;margin-top:12px}
.eyebrow{font:700 .75rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px;border-radius:8px}
button{font:inherit;color:inherit;cursor:pointer}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.brand .dots{display:grid;grid-template-columns:repeat(2,12px);gap:4px}
.brand .dots i{width:12px;height:12px;border-radius:4px;display:block}
.brand .wm{font:800 .95rem/1.1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.top-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font:700 .8rem var(--f-mono);padding:7px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line)}
.pill.hot{border-color:var(--phys);color:var(--phys)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 1rem var(--f-body);padding:14px 24px;border-radius:16px;border:2px solid var(--ink);background:var(--ac);color:var(--ink);box-shadow:4px 4px 0 var(--fg);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--fg)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--fg)}
.btn.small{padding:9px 16px;font-size:.9rem;box-shadow:3px 3px 0 var(--fg);border-radius:12px}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--fg);transform:none;box-shadow:none}
.back{background:none;border:0;color:var(--mute);font:700 .9rem var(--f-mono);padding:6px 0;margin-bottom:14px}
.back:hover{color:var(--fg)}

/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px}
input[type=text],input[type=email]{width:100%;background:var(--card-2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--fg);font:500 1rem var(--f-body)}
input[type=text]:focus,input[type=email]:focus{border-color:var(--ac);outline:none}
label{font:700 .8rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.err{color:var(--bio);font-weight:600;min-height:1.4em}
.small-note{font-size:.85rem;color:var(--mute)}

/* login + welcome */
.split{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;min-height:70vh}
.stack{display:grid;gap:14px}
.orbit{position:relative;width:min(320px,72vw);aspect-ratio:1;margin-inline:auto}
.orbit .core{position:absolute;inset:38%;border-radius:50%;background:var(--fg);color:var(--ink);display:grid;place-items:center;font:800 1.15rem var(--f-display)}
.orbit .ring{position:absolute;border-radius:50%;border:2px dashed var(--line);animation:spin var(--d) linear infinite}
.orbit .ring::after{content:"";position:absolute;top:-9px;left:calc(50% - 9px);width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:0 0 18px var(--c)}
.orbit .r1{inset:27%;--d:5s;--c:var(--computer)}
.orbit .r2{inset:17%;--d:8s;--c:var(--chem);animation-direction:reverse}
.orbit .r3{inset:8%;--d:12s;--c:var(--bio)}
.orbit .r4{inset:0;--d:17s;--c:var(--phys);animation-direction:reverse}
@keyframes spin{to{transform:rotate(1turn)}}
.stats3{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{font:700 .8rem var(--f-mono);padding:6px 12px;border-radius:999px;border:2px solid var(--c);color:var(--c)}

/* subject grid */
.head{margin-bottom:26px}
.grid-subj{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px}
.scard,.tcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--card);border:2px solid var(--ac);border-radius:24px;padding:22px;box-shadow:6px 6px 0 color-mix(in srgb,var(--ac) 55%,transparent);transition:transform .12s,box-shadow .12s;min-width:0}
.scard:hover,.tcard:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 color-mix(in srgb,var(--ac) 55%,transparent)}
.glyph{display:grid;place-items:center;width:72px;height:72px;border-radius:18px;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font:800 1.15rem var(--f-display);white-space:nowrap}
.glyph.big{width:96px;height:96px;font-size:1.45rem;flex:none}
.scard p{color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.meta{font:700 .78rem var(--f-mono);color:var(--mute);letter-spacing:.04em}
.go{margin-top:4px;font:700 .95rem var(--f-body);color:var(--ac)}

/* subject page */
.shead{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin-bottom:34px}
.shead>div:last-child{min-width:0;flex:1 1 300px}
.h2{margin:34px 0 16px}
.grid-topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px}
.tag{align-self:flex-start;font:700 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}
.tag.done{background:var(--chem);color:var(--ink)}
.arena{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;border-color:var(--ac)}
.arena p{color:var(--mute);margin-top:4px}

/* topic page */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;margin:22px -4px 8px}
.tab{white-space:nowrap;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700}
.tab[aria-selected=true]{background:var(--ac);color:var(--ink);border-color:var(--ac)}
.tab:hover{border-color:var(--ac)}
.hint{color:var(--mute);margin:10px 0 16px}
.hint b{color:var(--ac)}

/* simulations */
.stagebox{border:2px solid var(--line);border-radius:20px;background:#0F0B22;overflow:hidden}
canvas.stage{display:block;width:100%}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px 28px;margin-top:16px;padding:18px;background:var(--card);border:2px solid var(--line);border-radius:20px}
.ctl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;min-width:0}
.ctl output{font:700 .95rem var(--f-mono);color:var(--ac)}
.ctl input{grid-column:1/-1;width:100%;accent-color:var(--ac);height:28px}
.btnrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card-2);font-weight:700;font-size:.9rem}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--ink);border-color:var(--ac)}
.readout{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 16px;min-width:0}
.stat b{display:block;font:700 1.1rem var(--f-mono);color:var(--ac)}
.stat span{font:700 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.note{margin-top:14px;padding:14px 18px;border-radius:16px;background:var(--card);border:2px dashed var(--line);color:var(--mute)}
.note b{color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.legend span{font:700 .85rem var(--f-mono);padding:6px 12px;border-radius:10px;color:var(--ink)}
.seq{font:700 .95rem var(--f-mono);letter-spacing:.14em;overflow-x:auto;white-space:nowrap}

/* cell */
.cell-svg{display:block;width:100%;height:auto;background:#0F0B22;border:2px solid var(--line);border-radius:20px}
.cell-svg .o{cursor:pointer;animation:bob 5s ease-in-out infinite;animation-delay:calc(var(--i,0)*-1s)}
@keyframes bob{50%{transform:translateY(-4px)}}
.cell-svg .o .f{fill:color-mix(in srgb,var(--oc) 28%,transparent);stroke:var(--oc);stroke-width:3}
.cell-svg .o .s{fill:none;stroke:var(--oc);stroke-width:5;stroke-linecap:round}
.cell-svg .o .d{fill:var(--oc)}
.cell-svg .o:hover,.cell-svg .o.sel{filter:drop-shadow(0 0 9px var(--oc))}
.cell-svg .o.sel .f{stroke-width:5}
.cell-svg .o.sel .s{stroke-width:8}
.cell-svg .o:focus-visible{outline:none;filter:drop-shadow(0 0 12px var(--fg))}
.info{margin-top:16px;padding:20px;border-radius:20px;background:var(--card);border:2px solid var(--ac)}
.info h3{color:var(--ac);margin-bottom:8px}
.info .an{margin-top:10px;font-weight:600}
.info .an span{font:700 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--phys);margin-right:8px}

/* binary */
.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.bit{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:14px;border:2px solid var(--line);background:var(--card-2);transition:background .15s,transform .12s}
.bit .pv{font:700 .68rem var(--f-mono);color:var(--mute)}
.bit .b{font:800 clamp(1.1rem,4vw,1.8rem) var(--f-display)}
.bit[aria-checked=true]{background:var(--ac);border-color:var(--ac);color:var(--ink);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 60%,transparent)}
.bit[aria-checked=true] .pv{color:var(--ink)}
.bit:active{transform:scale(.95)}
.binout{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;align-items:stretch}
.binout .big{flex:1 1 160px;font:800 clamp(2rem,7vw,3.2rem) var(--f-display);color:var(--ac);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 20px;line-height:1.2}
.binout .big small{display:block;font:700 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.binout .big em{display:block;font:500 .85rem var(--f-mono);color:var(--mute);font-style:normal;letter-spacing:0;overflow-wrap:anywhere}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.names button{display:flex;flex-direction:column;align-items:center;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card-2);min-width:0}
.names button b{font:800 1.1rem var(--f-display);color:var(--ac)}
.names button span{font:500 .72rem var(--f-mono);color:var(--mute)}
.names button:hover{border-color:var(--ac)}
.field{margin-top:20px;display:grid;gap:8px}

/* explain */
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:14px}
.ex{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;min-width:0}
.ex h3{color:var(--ac);margin-bottom:8px}
.tldr,.fact{margin-top:18px;padding:20px 22px;border-radius:20px}
.tldr{background:var(--ac);color:var(--ink)}
.tldr b,.fact b{font:700 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:6px}
.tldr p{font:800 1.1rem/1.4 var(--f-display)}
.fact{border:2px dashed var(--phys)}
.fact b{color:var(--phys)}

/* voice */
.voice{margin-top:14px;display:grid;gap:18px}
.player{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:var(--card);border:2px solid var(--ac);border-radius:22px;padding:20px}
.wave{display:flex;align-items:center;gap:3px;height:56px;flex:1 1 200px;min-width:0}
.wave span{flex:1;max-width:8px;height:100%;border-radius:4px;background:var(--ac);transform:scaleY(var(--h,.3));opacity:.55}
.wave.on span{animation:eq .9s ease-in-out infinite;animation-delay:calc(var(--i)*-70ms);opacity:1}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.player select{background:var(--card-2);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:9px 12px;font:600 .9rem var(--f-body)}
.transcript{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;font-size:1.05rem;line-height:1.9}
.transcript span{cursor:pointer;padding:2px 3px;border-radius:6px}
.transcript span:hover{background:color-mix(in srgb,var(--ac) 18%,transparent)}
.transcript span.now{background:var(--ac);color:var(--ink)}

/* quiz */
.quiz{margin-top:14px;max-width:760px;position:relative}
.qhead{display:flex;align-items:center;gap:14px;font:700 .8rem var(--f-mono);color:var(--mute);margin-bottom:16px}
.qbar{flex:1;height:8px;background:var(--card);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.qtext{font-size:clamp(1.1rem,3vw,1.4rem);line-height:1.35;margin-bottom:18px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:600}
.opt .key{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--card-2);font:700 .85rem var(--f-mono);color:var(--mute)}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--chem);background:color-mix(in srgb,var(--chem) 16%,var(--card))}
.opt.right .key{background:var(--chem);color:var(--ink)}
.opt.wrong{border-color:var(--bio);background:color-mix(in srgb,var(--bio) 14%,var(--card))}
.opt.wrong .key{background:var(--bio);color:var(--ink)}
.fb{min-height:1.6em;margin-top:16px;font-weight:600}
.fb.ok{color:var(--chem)} .fb.no{color:var(--bio)}
.qfoot{margin-top:16px}
.result{text-align:center;padding:30px 16px;position:relative;overflow:hidden}
.result .score{font:800 clamp(3rem,12vw,5rem) var(--f-display);color:var(--ac);line-height:1}
.result p{margin-top:12px;color:var(--mute)}
.result .xp{display:inline-block;margin-top:14px;font:800 1.1rem var(--f-mono);color:var(--ink);background:var(--phys);padding:6px 16px;border-radius:99px}
.result .btnrow{justify-content:center;margin-top:22px}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.burst i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}

.foot{margin-top:50px;color:var(--mute);font:600 .85rem var(--f-mono);text-align:center}

@media (max-width:760px){
  .split{grid-template-columns:1fr;min-height:0;gap:20px}
  .split .orbit{order:-1;width:min(220px,60vw)}
  .shead{gap:14px}
}
@media (prefers-reduced-motion:reduce){
  .orbit .ring,.cell-svg .o,.wave.on span,.burst i{animation:none}
  .btn,.scard,.tcard{transition:none}
}

/* ===== hero, tagline, illustrations ===== */
.mega{font:800 clamp(2.1rem,9.4vw,6.2rem)/.98 var(--f-display);text-transform:uppercase;letter-spacing:-.035em;margin:0}
.mega span{display:inline-block}
.mega .m2{background:linear-gradient(90deg,var(--computer),var(--chem),var(--bio),var(--phys));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.mega .m3{color:var(--phys)}
@supports (-webkit-text-stroke:1px #000){.mega .m3{color:transparent;-webkit-text-stroke:max(2px,.025em) var(--fg)}}
.mega.sm{font-size:clamp(1.6rem,5.6vw,3.4rem)}
.tagline{font:700 clamp(1.15rem,3.6vw,1.9rem)/1.25 var(--f-display);margin-top:16px;color:var(--fg);letter-spacing:-.01em}
.tagline b{color:var(--chem)}
.byline{margin-top:10px;font:700 .8rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hero{padding-block:8px 28px}
.hero .lead{margin-top:14px}
.illus{border-radius:18px;background:color-mix(in srgb,var(--ac) 12%,var(--card-2));overflow:hidden;line-height:0}
.illus svg{display:block;width:100%;height:auto}
.ill-float{animation:illf 4s ease-in-out infinite}
.ill-spin{animation:spin 16s linear infinite}
.ill-rise{animation:illr 3.6s ease-in infinite}
@keyframes illf{50%{transform:translateY(-7px)}}
@keyframes illr{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-52px);opacity:0}}
.slogan{font:700 1rem var(--f-body);color:var(--ac);margin-top:-2px}
.scard .slogan{margin-top:0}
.sbanner{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:34px}
.sbanner .illus{border:2px solid var(--ac)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tg{display:grid;place-items:center;min-width:54px;height:54px;padding-inline:8px;border-radius:14px;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font:800 .85rem var(--f-display);white-space:nowrap}
.tnav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:40px}
@media (max-width:760px){.sbanner{grid-template-columns:1fr}}

/* ===== new visual widgets ===== */
.tt{border-collapse:collapse;margin-top:16px;min-width:260px}
.tt th,.tt td{border:2px solid var(--line);padding:8px 14px;text-align:center;font:700 .95rem var(--f-mono)}
.tt th{color:var(--mute);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.tt tr.hl td{background:var(--ac);color:var(--ink)}
.pxwrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pxgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:min(100%,340px);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--line);padding:3px;border-radius:14px}
.pxc{background:#0F0B22;border-radius:5px}
.pxc.on{background:var(--ac);box-shadow:0 0 12px color-mix(in srgb,var(--ac) 60%,transparent)}
.pxbytes{flex:1 1 220px;min-width:0;font:700 .95rem/1.9 var(--f-mono)}
.pxbytes b{color:var(--ac)}
.alpha{display:grid;grid-template-columns:70px repeat(26,minmax(20px,1fr));gap:3px;margin-bottom:3px}
.alpha span{display:grid;place-items:center;height:30px;border-radius:6px;background:var(--card-2);font:700 .8rem var(--f-mono);color:var(--mute)}
.alpha span.u{background:var(--ac);color:var(--ink)}

(function(){

const MONO="'JetBrains Mono',ui-monospace,monospace";

const KEY='next-gen-academy-v1';
let S={user:null,xp:0,done:{},best:{},streak:0,lastDay:''};
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function dayStr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function touchStreak(){
  const today=dayStr(new Date());if(S.lastDay===today)return;
  const y=dayStr(new Date(Date.now()-864e5));
  S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=today;save();
}
const level=()=>Math.floor(S.xp/50)+1;

/* ---------- cleanup registry ---------- */
let cleanups=[];
const addCleanup=f=>cleanups.push(f);
function runCleanups(){cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];stopSpeak();}

/* ---------- canvas helpers ---------- */
function stage(box,ratio){
  const c=document.createElement('canvas');c.className='stage';box.appendChild(c);
  const ctx=c.getContext('2d');const s={c,ctx,w:0,h:0,dpr:1};
  s.fit=function(){
    const w=c.clientWidth||300,h=Math.max(240,Math.round(w*ratio)),dpr=Math.min(window.devicePixelRatio||1,2);
    if(w!==s.w||h!==s.h||dpr!==s.dpr){s.w=w;s.h=h;s.dpr=dpr;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.height=h+'px';}
    ctx.setTransform(s.dpr,0,0,s.dpr,0,0);
  };
  s.fit();return s;
}
function loop(fn){
  let id=0,alive=true,last=performance.now(),clock=0;
  function f(t){if(!alive)return;const dt=Math.min(0.05,(t-last)/1000);last=t;clock+=dt;try{fn(dt,clock);}catch(e){if(!window.__le){window.__le=1;console.error('visual error: '+(e&&e.message));}}id=requestAnimationFrame(f);}
  id=requestAnimationFrame(f);
  return function(){alive=false;cancelAnimationFrame(id);};
}
function ctl(parent,o){
  const w=mk('div','ctl');
  w.innerHTML='<label for="'+o.id+'">'+o.label+'</label><output for="'+o.id+'"></output><input id="'+o.id+'" type="range" min="'+o.min+'" max="'+o.max+'" step="'+(o.step||1)+'" value="'+o.value+'">';
  parent.appendChild(w);
  const inp=$('input',w),out=$('output',w),fmt=o.fmt||(v=>v);
  const upd=()=>{out.textContent=fmt(+inp.value);};
  inp.addEventListener('input',()=>{upd();o.on(+inp.value);});upd();
  return {inp:inp,set:function(v){inp.value=v;upd();}};
}
function btn(parent,text,on,cls){
  const b=mk('button',cls||'btn small',text);b.type='button';b.addEventListener('click',on);parent.appendChild(b);return b;
}

const SUBJECTS=[
{id:'computer',name:'Computer',tag:'Code and logic',slogan:'Think like the machine.',glyph:'{ }',color:'var(--computer)',
 blurb:'How machines think. Bits, logic and the step by step recipes behind every app you use.',

 {id:'binary',title:'Binary: the language of computers',sub:'Flip the switches and watch numbers and letters appear.',kind:'Live simulation',vis:'binary',
  try:'Flip the eight switches. Then type your own name and tap a letter to load it.',

   {h:'Computers only know on and off',t:'Inside a chip there are billions of tiny switches. Each switch is either on, which we write as 1, or off, which we write as 0. One of these digits is called a bit.'},

{id:'chemistry',name:'Chemistry',tag:'Matter and change',slogan:'Everything is made of something.',glyph:'H₂O',color:'var(--chem)',

{id:"cipher",g:"A→D",title:"Secret codes and encryption",sub:"Shift the alphabet and lock your message.",kind:"Live simulation",vis:"cipher",

  {h:"The Caesar cipher",t:"Julius Caesar shifted every letter along the alphabet by a fixed number. With a shift of 3, A becomes D and B becomes E."},
  {h:"The key is the secret",t:"The shift number is the key. Anyone who knows it can undo the code by shifting back."},

{id:"bsearch",g:"÷2",title:"Binary search",sub:"Find a number by cutting the list in half.",kind:"Live simulation",vis:"bsearch",

  {h:"Why it is fast",t:"Each step halves the list. A list of one million items needs only about 20 steps, while checking one by one could need a million."},

{id:"internet",g:"www",title:"How the internet works",sub:"Follow a request from your phone to a server and back.",kind:"Step by step animation",vis:"internet",

  {h:"Names and addresses",t:"Computers find each other using numbers called IP addresses. A service called DNS works like a phone book that turns a name such as example.com into a number."},

  {q:"What is a server?",o:["A computer that stores websites and sends them to you","A type of phone","A Wi-Fi password","A search engine only"],a:0,why:"Servers keep websites and answer requests from users."}]},

  {h:"Decode and execute",t:"It decodes what the instruction means, then the ALU, the arithmetic logic unit, does the maths or comparison."},
  {h:"Store",t:"The result is saved in a register or in memory, and then the cycle starts again."}],

  {h:"Columns are groups",t:"Elements in the same column behave in similar ways because they have the same number of outer electrons. Group 1 metals are very reactive, and group 18 noble gases barely react at all."},

{id:"ph",g:"pH",title:"Acids, bases and pH",sub:"Slide across the pH scale and watch the particles change.",kind:"Live simulation",vis:"ph",

  {h:"What pH measures",t:"pH tells you how acidic or basic a liquid is on a scale from 0 to 14. Seven is neutral, like pure water."},
  {h:"Acids",t:"Acids have a pH below 7 and release hydrogen ions. Lemon juice and vinegar are acids. They taste sour."},
  {h:"Bases",t:"Bases have a pH above 7 and release hydroxide ions. Soap and baking soda are bases. They feel slippery."},
  {h:"A tenfold scale",t:"Each step on the scale means ten times more or less hydrogen ions. A pH of 3 is a hundred times more acidic than a pH of 5."}],

  {q:"How much more acidic is pH 3 than pH 5?",o:["2 times","10 times","100 times","1000 times"],a:2,why:"Two steps down means ten times ten, which is 100 times."}]},
{id:"bonds",g:"Na+Cl",title:"Chemical bonds",sub:"Watch electrons jump or share to hold atoms together.",kind:"Live simulation",vis:"bonds",
 try:"Switch between Ionic and Covalent and watch what the electrons do.",
 explain:[
  {h:"Why atoms bond",t:"Atoms are most stable with a full outer shell of electrons. They bond to get there."},
  {h:"Ionic bonds",t:"In an ionic bond one atom gives electrons to another. Sodium gives one electron to chlorine, so they become a positive ion and a negative ion that attract each other. The result is table salt."},
  {h:"Covalent bonds",t:"In a covalent bond atoms share electrons. Two hydrogen atoms share a pair of electrons to make a hydrogen molecule."},
  {h:"Properties",t:"Ionic compounds usually form hard crystals with high melting points. Covalent molecules such as water are often liquids or gases."}],
 tldr:"Ionic bonds transfer electrons and covalent bonds share them.",
 fact:"Water, carbon dioxide and sugar are all held together by covalent bonds.",
 quiz:[
  {q:"In an ionic bond, electrons are...",o:["Shared equally","Transferred","Destroyed","Created"],a:1,why:"One atom gives electrons and the other receives them."},
  {q:"What do two hydrogen atoms do to form H2?",o:["Share electrons","Lose all electrons","Swap protons","Join nuclei"],a:0,why:"They share one pair of electrons in a covalent bond."},
  {q:"Why do atoms bond?",o:["To get a full outer shell","To get heavier","To change colour","To make noise"],a:0,why:"A full outer shell is a stable arrangement."}]},
{id:"balance",g:"2H₂",title:"Balancing equations",sub:"Same atoms in, same atoms out. Fix the equation.",kind:"Live puzzle",vis:"balance",
 try:"Use the plus and minus buttons until every row in the atom table shows a tick.",
 explain:[
  {h:"Atoms are never lost",t:"In a chemical reaction atoms are rearranged, not created or destroyed. So the number of each atom must be the same on both sides."},
  {h:"Coefficients",t:"We balance an equation by changing the big numbers in front of the formulas, called coefficients. We never change the small subscript numbers."},
  {h:"Count and adjust",t:"Count each element on both sides, find one that does not match, change a coefficient, and count again."},
  {h:"Conservation of mass",t:"Because atoms are conserved, the total mass before and after a reaction stays the same."}],
 tldr:"Balance an equation by changing coefficients until every atom count matches.",
 fact:"Antoine Lavoisier showed the law of conservation of mass in the 1700s.",
 quiz:[
  {q:"What do we change to balance an equation?",o:["Coefficients","Subscripts","Element symbols","The arrow"],a:0,why:"Only the big numbers in front of formulas can be changed."},
  {q:"In 2H2O, how many hydrogen atoms are there?",o:["2","3","4","6"],a:2,why:"2 molecules times 2 hydrogen atoms each makes 4."},
  {q:"What is conserved in a chemical reaction?",o:["Atoms and mass","Colour","Temperature","Volume"],a:0,why:"Atoms are only rearranged, so mass stays the same."}]},
{id:"boyle",g:"PV",title:"Gas laws",sub:"Squeeze or heat a gas and watch the pressure.",kind:"Live simulation",vis:"boyle",
 try:"Slide the volume down and the temperature up. Watch the gauge.",
 explain:[
  {h:"Gas pressure",t:"Gas pressure comes from particles hitting the walls of their container. More hits every second means higher pressure."},
  {h:"Squeeze it",t:"If you reduce the volume at the same temperature, the particles hit the walls more often and pressure goes up. This is Boyle law."},
  {h:"Heat it",t:"If you raise the temperature, particles move faster and hit harder, so pressure goes up at the same volume."},
  {h:"Everyday life",t:"A bike pump, a pressure cooker and a car tyre on a hot day all show gas laws at work."}],
 tldr:"Less volume or more heat means higher pressure.",
 fact:"Scuba divers must breathe out as they rise because the air in their lungs expands as the pressure drops.",
 quiz:[
  {q:"What happens to pressure if you halve the volume at constant temperature?",o:["It halves","It doubles","It stays the same","It becomes zero"],a:1,why:"Pressure and volume are inversely related. Half the volume gives double the pressure."},
  {q:"What causes gas pressure?",o:["Particles hitting the walls","Particles sticking together","Gravity only","Light"],a:0,why:"Millions of tiny collisions with the walls add up to pressure."},
  {q:"Raising the temperature of a gas in a fixed container...",o:["Lowers pressure","Raises pressure","Does nothing","Changes the gas"],a:1,why:"Faster particles hit the walls harder and more often."}]},
{id:"rates",g:"↑T",title:"Reaction rates",sub:"Heat the particles and count the collisions.",kind:"Live simulation",vis:"rates",
 try:"Raise the temperature and watch how many collisions turn into products.",
 explain:[
  {h:"Collisions drive reactions",t:"For a reaction to happen, particles must collide with enough energy. Not every collision works."},
  {h:"Temperature",t:"Heating makes particles move faster, so they collide more often and with more energy. The reaction speeds up."},
  {h:"Concentration",t:"More particles in the same space means more collisions every second, so the reaction is faster."},
  {h:"Catalysts",t:"A catalyst lowers the energy needed to react, so more collisions are successful. Enzymes in your body are natural catalysts."}],
 tldr:"More collisions with more energy means a faster reaction.",
 fact:"Food goes off more slowly in a fridge because the cold slows down the reactions that spoil it.",
 quiz:[
  {q:"How does heating speed up a reaction?",o:["Particles collide more often and harder","Particles get bigger","Particles disappear","Particles stop moving"],a:0,why:"Faster particles collide more often and with more energy."},
  {q:"What does a catalyst do?",o:["Lowers the energy needed to react","Uses itself up","Heats the mixture","Adds colour"],a:0,why:"A catalyst makes it easier for collisions to succeed."},
  {q:"A higher concentration means...",o:["Fewer collisions","More collisions","No change","Slower particles"],a:1,why:"More particles in the same space bump into each other more often."}]},
{id:"density",g:"m/V",title:"Density: sink or float",sub:"Change the object and the liquid and see what happens.",kind:"Live simulation",vis:"density",
 try:"Move the density slider across 1.0 and then try a different liquid.",
 explain:[
  {h:"Mass in a space",t:"Density tells you how much mass is packed into a given volume. Density equals mass divided by volume."},
  {h:"Float or sink",t:"An object floats if it is less dense than the liquid and sinks if it is denser. Wood floats on water, while a stone sinks."},
  {h:"Floating partly",t:"A floating object sinks until the weight of water it pushes aside equals its own weight. So an object with half the density of water floats half submerged."},
  {h:"Why ships float",t:"A steel ship is shaped like a hollow bowl, so its average density, including the air inside, is less than water."}],
 tldr:"Less dense than the liquid floats, more dense sinks.",
 fact:"You float more easily in the Dead Sea because its very salty water is much denser than normal water.",
 quiz:[
  {q:"Density equals...",o:["Mass divided by volume","Volume divided by mass","Mass plus volume","Mass times volume"],a:0,why:"Density is how much mass fits in each unit of volume."},
  {q:"An object with density 0.5 grams per cubic centimetre is placed in water. It will...",o:["Sink","Float","Dissolve","Explode"],a:1,why:"Water has a density of 1, so the lighter object floats."},
  {q:"Why can a steel ship float?",o:["Its average density is less than water","Steel is lighter than water","The sea is magic","It is painted"],a:0,why:"The ship is mostly air inside, which lowers its average density."}]},
{id:"solutions",g:"mol/L",title:"Solutions and dissolving",sub:"Add sugar to water and find where it stops dissolving.",kind:"Live simulation",vis:"solutions",
 try:"Add spoons of sugar until crystals stay at the bottom. Then heat the water.",
 explain:[
  {h:"Solute and solvent",t:"When sugar dissolves in water, the sugar is the solute and the water is the solvent. Together they make a solution."},
  {h:"What dissolving means",t:"Water particles pull the sugar particles apart and spread them out. The sugar has not vanished. It is still there."},
  {h:"Saturation",t:"A solvent can hold only so much solute. When it cannot dissolve any more, the solution is saturated and the extra solid sinks to the bottom."},
  {h:"Temperature",t:"Warm water usually dissolves more solid than cold water, which is why sugar dissolves faster in hot tea."}],

 fact:"Gases behave the opposite way. Carbon dioxide dissolves better in cold drinks, so warm cola goes flat faster.",

  {q:"In sugar water, what is the solvent?",o:["Sugar","Water","Both","Neither"],a:1,why:"The solvent is the liquid that does the dissolving."},
  {q:"A saturated solution...",o:["Cannot dissolve any more solute","Has no solute","Is always hot","Is a gas"],a:0,why:"It is already holding as much as it can."},
  {q:"What usually helps solids dissolve more?",o:["Warmer water","Colder water","A bigger container","Less water"],a:0,why:"Warm water gives particles more energy to pull the solid apart."}]}

{id:"mitosis",g:"1→2",title:"Cell division: mitosis",sub:"Step through the stages as one cell becomes two.",kind:"Step by step animation",vis:"mitosis",

 explain:[
  {h:"Why cells divide",t:"Cells divide so you can grow and repair cuts. Mitosis makes two identical copies of a cell."},
  {h:"Preparing",t:"In interphase the cell grows and copies its DNA. In prophase the DNA coils into visible chromosomes and the wall around the nucleus breaks down."},
  {h:"Lining up and splitting",t:"In metaphase the chromosomes line up in the middle. In anaphase each chromosome is pulled apart into two identical halves that move to opposite ends."},
  {h:"Two new cells",t:"In telophase new nuclei form, and in cytokinesis the cell pinches in two. Each new cell has the same DNA as the original."}],

 fact:"Your body makes millions of new cells every second to replace old ones.",

  {q:"What does mitosis produce?",o:["Two identical cells","Four different cells","One bigger cell","Sperm cells"],a:0,why:"Mitosis gives two genetically identical daughter cells."},
  {q:"In which stage do chromosomes line up in the middle?",o:["Prophase","Metaphase","Anaphase","Telophase"],a:1,why:"Metaphase is when they line up along the middle."},
  {q:"When is the DNA copied?",o:["Before division, in interphase","During cytokinesis","After division","Never"],a:0,why:"The cell copies its DNA in interphase."}]},
{id:"heart",g:"BPM",title:"The heart and blood flow",sub:"Follow a drop of blood around the body.",kind:"Step by step animation",vis:"heart",

  {h:"Oxygen on the move",t:"Blood that returns from the body has low oxygen. In the lungs it picks up oxygen, then the left side pumps it out to every organ."},

 tldr:"Body, right side, lungs, left side, body. One full loop takes about a minute.",
 fact:"Your heart beats roughly 100,000 times every day.",

/* ---- Physics: projectile ---- */
function vProjectile(host){
  const ac=col('--phys'),pink=col('--bio');
  const box=mk('div','stagebox');host.append(box);const st=stage(box,.55);
  const controls=mk('div','controls');host.append(controls);
  const read=mk('div','readout');host.append(read);
  const g=9.8;let angle=45,speed=25,t=0,flying=false,landed=false,trail=[],vx,vy,T,R,H;
  function calc(){const r=angle*Math.PI/180;vx=speed*Math.cos(r);vy=speed*Math.sin(r);T=2*vy/g;R=vx*T;H=vy*vy/(2*g);}
  function stats(){read.innerHTML=stat(R.toFixed(1)+' m','Range')+stat(H.toFixed(1)+' m','Max height')+stat(T.toFixed(1)+' s','Flight time');}
  function reset(){calc();t=0;flying=false;landed=false;trail=[];stats();}
  const A=ctl(controls,{id:'pa',label:'Launch angle',min:10,max:80,value:45,fmt:v=>v+'°',on:v=>{angle=v;reset();}});
  ctl(controls,{id:'ps',label:'Launch speed',min:10,max:40,value:25,fmt:v=>v+' m/s',on:v=>{speed=v;reset();}});
  const row=mk('div','btnrow');controls.append(row);
  btn(row,'Launch',()=>{reset();flying=true;},'btn');
  btn(row,'Set 45°',()=>{angle=45;A.set(45);reset();},'btn small ghost');
  reset();
  addCleanup(loop(dt=>{
    st.fit();const ctx=st.ctx,w=st.w,h=st.h,pad=28,sc=(w-pad*2)/170,gy=h-34;
    ctx.clearRect(0,0,w,h);
    ctx.lineWidth=1;ctx.strokeStyle=GRID;ctx.font='11px '+MONO;ctx.textAlign='center';ctx.fillStyle=MUTE;
    for(let m=0;m<=160;m+=20){const x=pad+m*sc;ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,8);ctx.stroke();if(m%40===0)ctx.fillText(m+' m',x,gy+20);}
    for(let m=20;gy-m*sc>8;m+=20){ctx.beginPath();ctx.moveTo(0,gy-m*sc);ctx.lineTo(w,gy-m*sc);ctx.stroke();}
    ctx.fillStyle='#1A1536';ctx.fillRect(0,gy,w,h-gy);ctx.strokeStyle=ac;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(w,gy);ctx.stroke();
    const px=tt=>pad+vx*tt*sc,py=tt=>gy-(vy*tt-.5*g*tt*tt)*sc;
    ctx.setLineDash([5,7]);ctx.strokeStyle='rgba(171,163,209,.55)';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<=40;i++){const tt=T*i/40;if(i===0)ctx.moveTo(px(tt),py(tt));else ctx.lineTo(px(tt),py(tt));}
    ctx.stroke();ctx.setLineDash([]);
    if(flying){t+=dt*1.6;if(t>=T){t=T;flying=false;landed=true;}trail.push([px(t),py(t)]);}
    for(let i=0;i<trail.length;i++){ctx.fillStyle='rgba(255,182,61,'+(i/trail.length*.6)+')';ctx.beginPath();ctx.arc(trail[i][0],trail[i][1],4,0,6.3);ctx.fill();}
    if(landed){const x=px(T);ctx.strokeStyle=pink;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,gy-26);ctx.stroke();ctx.fillStyle=pink;ctx.beginPath();ctx.moveTo(x,gy-26);ctx.lineTo(x+16,gy-20);ctx.lineTo(x,gy-14);ctx.fill();ctx.fillStyle='#F5F1FF';ctx.font='700 12px '+MONO;ctx.fillText(R.toFixed(0)+' m',x,gy-34);}
    ctx.save();ctx.translate(pad,gy);ctx.rotate(-angle*Math.PI/180);ctx.fillStyle='#F5F1FF';ctx.fillRect(0,-6,34,12);ctx.restore();
    ctx.fillStyle=ac;ctx.beginPath();ctx.arc(pad,gy,11,0,6.3);ctx.fill();
    ctx.fillStyle=ac;ctx.strokeStyle='#F5F1FF';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px(t),py(t),8,0,6.3);ctx.fill();ctx.stroke();
  }));
}

/* ---- Physics: waves ---- */
function vWave(host){
  const ac=col('--phys'),pink=col('--bio');
  const box=mk('div','stagebox');host.append(box);const st=stage(box,.5);
  const controls=mk('div','controls');host.append(controls);
  const read=mk('div','readout');host.append(read);
  const V=2;let f=1,A=40,inter=false;
  function stats(){read.innerHTML=stat(f.toFixed(1)+' Hz','Frequency')+stat((V/f).toFixed(2)+' m','Wavelength')+stat((1/f).toFixed(2)+' s','Period')+stat(V+' m/s','Wave speed');}
  ctl(controls,{id:'wf',label:'Frequency',min:.5,max:2,step:.1,value:1,fmt:v=>v.toFixed(1)+' Hz',on:v=>{f=v;stats();}});
  ctl(controls,{id:'wa',label:'Amplitude',min:10,max:60,value:40,fmt:v=>v+' px',on:v=>{A=v;}});
  const row=mk('div','btnrow');controls.append(row);
  const ib=btn(row,'Interference: off',()=>{inter=!inter;ib.textContent='Interference: '+(inter?'on':'off');},'btn small');
  stats();
  addCleanup(loop((dt,tm)=>{
    st.fit();const ctx=st.ctx,w=st.w,h=st.h,mid=h/2,ppm=w/8;
    ctx.clearRect(0,0,w,h);ctx.strokeStyle=GRID;ctx.lineWidth=1;
    for(let m=0;m<=8;m++){ctx.beginPath();ctx.moveTo(m*ppm,0);ctx.lineTo(m*ppm,h);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(w,mid);ctx.stroke();
    const f2=f*1.25,A2=A*.7;
    const y1=xm=>A*Math.sin(2*Math.PI*f/V*xm-2*Math.PI*f*tm);
    const y2=xm=>A2*Math.sin(2*Math.PI*f2/V*xm-2*Math.PI*f2*tm);
    function curve(fn,color,lw,dash){ctx.setLineDash(dash||[]);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.beginPath();for(let x=0;x<=w;x+=3){const y=mid-fn(x/ppm);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.setLineDash([]);}
    let main;
    if(inter){curve(y1,'rgba(255,182,61,.35)',2);curve(y2,'rgba(255,102,179,.45)',2,[6,6]);main=xm=>y1(xm)+y2(xm);curve(main,'#F5F1FF',4);}
    else{main=y1;curve(main,ac,4);}
    [1,3,5,7].forEach(xm=>{const x=xm*ppm,y=mid-main(xm);ctx.strokeStyle='rgba(245,241,255,.35)';ctx.setLineDash([3,4]);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,mid);ctx.lineTo(x,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=pink;ctx.strokeStyle='#F5F1FF';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,8,0,6.3);ctx.fill();ctx.stroke();});

/* ---- Chemistry: atom ---- */
const ELEMENTS=[['H','Hydrogen'],['He','Helium'],['Li','Lithium'],['Be','Beryllium'],['B','Boron'],['C','Carbon'],['N','Nitrogen'],['O','Oxygen'],['F','Fluorine'],['Ne','Neon'],['Na','Sodium'],['Mg','Magnesium'],['Al','Aluminium'],['Si','Silicon'],['P','Phosphorus'],['S','Sulfur'],['Cl','Chlorine'],['Ar','Argon']];
const COMMON_N=[0,2,4,5,6,6,7,8,10,10,12,12,14,14,16,16,18,22];
function vAtom(host){
  const mint=col('--chem'),pink=col('--bio');
  const box=mk('div','stagebox');host.append(box);const st=stage(box,.62);
  const controls=mk('div','controls');host.append(controls);
  const read=mk('div','readout');host.append(read);
  let p=6,n=6,e=6;let cn,ce;
  function stats(){
    const el=ELEMENTS[p-1],chg=p-e,cs=chg===0?'Neutral':(chg>0?'+'+chg+' ion':chg+' ion').replace('-','−');
    read.innerHTML=stat(el[1]+' ('+el[0]+')','Element')+stat(p+n,'Mass number')+stat(cs,'Charge')+stat(el[1]+'-'+(p+n),'Isotope');
  }
  ctl(controls,{id:'ap',label:'Protons (+)',min:1,max:18,value:6,on:v=>{p=v;n=COMMON_N[v-1];e=v;cn.set(n);ce.set(e);stats();}});
  cn=ctl(controls,{id:'an',label:'Neutrons',min:0,max:22,value:6,on:v=>{n=v;stats();}});
  ce=ctl(controls,{id:'ae',label:'Electrons (−)',min:0,max:18,value:6,on:v=>{e=v;stats();}});
  stats();
  addCleanup(loop((dt,tm)=>{
    st.fit();const ctx=st.ctx,w=st.w,h=st.h,cx=w/2,cy=h/2,u=Math.min(w,h)/2-10;
    ctx.clearRect(0,0,w,h);
    const radii=[.5*u,.72*u,.94*u];
    ctx.lineWidth=1.5;ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(171,163,209,.35)';
    radii.forEach(r=>{ctx.beginPath();ctx.arc(cx,cy,r,0,6.3);ctx.stroke();});ctx.setLineDash([]);
    const tot=p+n,sp=u*.062,pr=u*.03;let pp=0,nn=0;
    for(let i=0;i<tot;i++){
      const isP=(pp<p)&&(n===0||pp/p<=nn/n||nn>=n);if(isP)pp++;else nn++;
      const a=i*2.39996,r=sp*Math.sqrt(i+.5),x=cx+Math.cos(a)*r+Math.sin(tm*3+i)*.6,y=cy+Math.sin(a)*r+Math.cos(tm*3+i*1.3)*.6;
      ctx.fillStyle=isP?pink:'#8E86B8';ctx.beginPath();ctx.arc(x,y,pr,0,6.3);ctx.fill();ctx.strokeStyle='rgba(19,15,38,.7)';ctx.lineWidth=1;ctx.stroke();
    }
    const caps=[2,8,8];let left=e;
    caps.forEach((cap,si)=>{
      const cnt=Math.min(left,cap);left-=cnt;
      for(let k=0;k<cnt;k++){
        const a=tm*(.9-si*.22)+k*(6.2832/cnt)+si;
        const x=cx+Math.cos(a)*radii[si],y=cy+Math.sin(a)*radii[si];
        ctx.save();ctx.shadowColor=mint;ctx.shadowBlur=10;ctx.fillStyle=mint;ctx.beginPath();ctx.arc(x,y,u*.032,0,6.3);ctx.fill();ctx.restore();
      }
    });
    ctx.font='700 11px '+MONO;ctx.textAlign='left';
    [['Proton',pink],['Neutron','#8E86B8'],['Electron',mint]].forEach((l,i)=>{ctx.fillStyle=l[1];ctx.beginPath();ctx.arc(16,18+i*20,6,0,6.3);ctx.fill();ctx.fillStyle=MUTE;ctx.fillText(l[0],30,22+i*20);});
  }));
}

/* ---- Chemistry: states of matter ---- */
function vStates(host){
  const blue=col('--computer'),mint=col('--chem'),amber=col('--phys');
  const box=mk('div','stagebox');host.append(box);const st=stage(box,.6);
  const controls=mk('div','controls');host.append(controls);
  const read=mk('div','readout');host.append(read);
  let T=25;const cols=9,rows=6,parts=[];
  for(let i=0;i<cols*rows;i++)parts.push({c:i%cols,r:Math.floor(i/cols),x:0,y:0,vx:0,vy:0,init:false});
  const stateOf=v=>v<=0?'solid':(v<100?'liquid':'gas');
  const desc={solid:'Particles are locked in a pattern and only vibrate.',liquid:'Particles slide past each other but stay close.',gas:'Particles zoom around far apart and fill the box.'};
  let prev=stateOf(T),ceilY=null,xmin=0,xmax=0;
  function stats(){const s=stateOf(T);read.innerHTML=stat(T+' °C','Water temperature')+stat(s.toUpperCase(),'State')+'<div class="note" style="margin:0;flex:1 1 220px">'+desc[s]+'</div>';}
  ctl(controls,{id:'st',label:'Temperature',min:-50,max:150,value:25,fmt:v=>v+' °C',on:v=>{T=v;stats();}});
  stats();
  addCleanup(loop(dt=>{
    st.fit();const ctx=st.ctx,w=st.w,h=st.h,s=stateOf(T),spc=22;
    ctx.clearRect(0,0,w,h);
    const targetCeil=s==='gas'?8:(s==='liquid'?h*.6:h),tx0=s==='gas'?8:w*.15,tx1=s==='gas'?w-8:w*.85;
    if(ceilY===null){ceilY=targetCeil;xmin=tx0;xmax=tx1;}
    const k=Math.min(1,dt*3);ceilY+=(targetCeil-ceilY)*k;xmin+=(tx0-xmin)*k;xmax+=(tx1-xmax)*k;
    const speedT=s==='liquid'?40+T*.9:150+(T-100)*3,color=s==='solid'?blue:(s==='liquid'?mint:amber);
    parts.forEach(q=>{
      const hx=w/2+(q.c-(cols-1)/2)*spc,hy=h-24-q.r*spc;
      if(!q.init){q.x=hx;q.y=hy;q.init=true;}
      if(s==='solid'){
        const jig=300+(T+50)*8;
        q.vx+=((hx-q.x)*60-q.vx*5)*dt+(Math.random()-.5)*jig*dt*5;
        q.vy+=((hy-q.y)*60-q.vy*5)*dt+(Math.random()-.5)*jig*dt*5;
      }else{
        if(prev==='solid'){const a=Math.random()*6.283;q.vx=Math.cos(a)*speedT;q.vy=Math.sin(a)*speedT;}
        if(Math.hypot(q.vx,q.vy)<1){const a=Math.random()*6.283;q.vx=Math.cos(a)*speedT;q.vy=Math.sin(a)*speedT;}
        const sp=Math.hypot(q.vx,q.vy)||1,kk=1+(speedT/sp-1)*Math.min(1,dt*3);q.vx*=kk;q.vy*=kk;
        if(q.y<ceilY)q.vy+=900*dt;
      }
      q.x+=q.vx*dt;q.y+=q.vy*dt;
      if(s!=='solid'){
        if(q.x<xmin){q.x=xmin;q.vx=Math.abs(q.vx);}if(q.x>xmax){q.x=xmax;q.vx=-Math.abs(q.vx);}
        if(q.y>h-8){q.y=h-8;q.vy=-Math.abs(q.vy);}if(q.y<8){q.y=8;q.vy=Math.abs(q.vy);}
      }
    });
    prev=s;
    if(s==='solid'){ctx.strokeStyle='rgba(91,140,255,.35)';ctx.lineWidth=2;parts.forEach((q,i)=>{const r=parts[i+1],d=parts[i+cols];if(r&&q.c<cols-1){ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(r.x,r.y);ctx.stroke();}if(d){ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(d.x,d.y);ctx.stroke();}});}
    parts.forEach(q=>{ctx.save();ctx.shadowColor=color;ctx.shadowBlur=8;ctx.fillStyle=color;ctx.beginPath();ctx.arc(q.x,q.y,7,0,6.3);ctx.fill();ctx.restore();});
    ctx.fillStyle=color;ctx.font='800 16px '+MONO;ctx.textAlign='left';ctx.fillText(s.toUpperCase()+(s==='solid'?' · ice':(s==='liquid'?' · water':' · steam')),14,26);
  }));
}

function vDNA(host){
  const BC={A:col('--phys'),T:col('--computer'),C:col('--bio'),G:col('--chem')};
  const box=mk('div','stagebox');host.append(box);const st=stage(box,.5);
  const controls=mk('div','controls');host.append(controls);
  const seq='ATGCCGTAAGCTTGCAATCGGATCGA'.split(''),comp=seq.map(b=>({A:'T',T:'A',C:'G',G:'C'}[b])),n=seq.length;
  let speed=1,target=0,u=0,ang=0;
  ctl(controls,{id:'ds',label:'Spin speed',min:0,max:3,step:.1,value:1,fmt:v=>v.toFixed(1)+'x',on:v=>{speed=v;}});
  const row=mk('div','btnrow');controls.append(row);
  const ub=btn(row,'Unzip',()=>{target=target?0:1;ub.textContent=target?'Zip back':'Unzip';},'btn');
  host.append(mk('div','legend',['A','T','C','G'].map(b=>'<span style="background:'+BC[b]+'">'+b+'</span>').join('')+'<span style="background:var(--card);color:var(--fg)">A pairs with T · C pairs with G</span>'));
  host.append(mk('div','note','<b>Top strand</b><div class="seq">'+seq.join(' ')+'</div><b>Partner strand</b><div class="seq">'+comp.join(' ')+'</div>'));
  addCleanup(loop(dt=>{
    st.fit();const ctx=st.ctx,w=st.w,h=st.h,mid=h/2,R=Math.min(h*.26,62);
    ctx.clearRect(0,0,w,h);
    ang+=dt*speed*1.2;u+=(target-u)*Math.min(1,dt*1.6);
    if(Math.abs(target-u)<.002)u=target;
    const pts=[];
    for(let i=0;i<n;i++){
      const s=i/(n-1),x=22+s*(w-44),ph=ang+i*.5,sin=Math.sin(ph),z=Math.cos(ph);
      const sep=clamp((u*1.3-s)/.25,0,1),off=sep*34;
      pts.push({x:x,y1:mid+sin*R*(1-.35*sep)-off,y2:mid-sin*R*(1-.35*sep)+off,z:z,sep:sep,i:i});
    }
    [['y1','#B9A7FF',1],['y2','#FF8CC6',-1]].forEach(sd=>{
      for(let i=0;i<n-1;i++){const a=pts[i],b=pts[i+1],z=(sd[2]*(a.z+b.z))/2;ctx.strokeStyle=sd[1];ctx.globalAlpha=.45+.35*(z+1)/2;ctx.lineWidth=3+2*(z+1)/2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a[sd[0]]);ctx.lineTo(b.x,b[sd[0]]);ctx.stroke();}
    });
    ctx.globalAlpha=1;
    const order=pts.slice().sort((a,b)=>a.z-b.z);
    order.forEach(q=>{
      const m=(q.y1+q.y2)/2,a1=1-q.sep;
      if(a1>.02){
        ctx.globalAlpha=a1*(.55+.45*(q.z+1)/2);ctx.lineWidth=5;ctx.lineCap='round';
        ctx.strokeStyle=BC[seq[q.i]];ctx.beginPath();ctx.moveTo(q.x,q.y1);ctx.lineTo(q.x,m);ctx.stroke();
        ctx.strokeStyle=BC[comp[q.i]];ctx.beginPath();ctx.moveTo(q.x,m);ctx.lineTo(q.x,q.y2);ctx.stroke();
      }
      ctx.globalAlpha=1;
      [[q.y1,seq[q.i],q.z],[q.y2,comp[q.i],-q.z]].forEach(nd=>{
        const r=6+3*(nd[2]+1)/2;ctx.fillStyle=BC[nd[1]];ctx.beginPath();ctx.arc(q.x,nd[0],r,0,6.3);ctx.fill();
        if(r>=8){ctx.fillStyle='#130F26';ctx.font='800 '+Math.round(r*1.1)+'px '+MONO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(nd[1],q.x,nd[0]+1);ctx.textBaseline='alphabetic';}
      });
    });
    ctx.globalAlpha=1;
  }));
}

/* ---- Computer: sorting ---- */
function vSorting(host){
  const amber=col('--phys'),pink=col('--bio'),mint=col('--chem'),blue=col('--computer');
  const box=mk('div','stagebox');host.append(box);const st=stage(box,.5);
  const controls=mk('div','controls');host.append(controls);
  const read=mk('div','readout');host.append(read);
  const N=20;let arr=[],algo='bubble',gen=null,playing=false,finished=false,cur=null,done=new Set(),acc=0,speed=14,sweep=-1,cmp=0,swp=0;
  const algoNames={bubble:'Bubble sort',selection:'Selection sort',insertion:'Insertion sort'};
  function stats(){read.innerHTML=stat(algoNames[algo],'Algorithm')+stat(cmp,'Comparisons')+stat(swp,'Swaps')+stat(finished?'Sorted':(playing?'Running':'Ready'),'Status');}
  function* bubble(a){const n=a.length;for(let i=0;i<n-1;i++){let sw=false;for(let j=0;j<n-1-i;j++){cmp++;yield{a:j,b:j+1,t:'cmp'};if(a[j]>a[j+1]){const x=a[j];a[j]=a[j+1];a[j+1]=x;swp++;sw=true;yield{a:j,b:j+1,t:'swap'};}}done.add(n-1-i);if(!sw)break;}}
  function* selection(a){const n=a.length;for(let i=0;i<n-1;i++){let m=i;for(let j=i+1;j<n;j++){cmp++;yield{a:m,b:j,t:'cmp'};if(a[j]<a[m])m=j;}if(m!==i){const x=a[i];a[i]=a[m];a[m]=x;swp++;yield{a:i,b:m,t:'swap'};}done.add(i);}}
  function* insertion(a){const n=a.length;for(let i=1;i<n;i++){let j=i;while(j>0){cmp++;yield{a:j-1,b:j,t:'cmp'};if(a[j-1]>a[j]){const x=a[j];a[j]=a[j-1];a[j-1]=x;swp++;yield{a:j-1,b:j,t:'swap'};j--;}else break;}}}
  const gens={bubble:bubble,selection:selection,insertion:insertion};
  function shuffle(){arr=[];for(let i=1;i<=N;i++)arr.push(i);for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=arr[i];arr[i]=arr[j];arr[j]=x;}gen=null;playing=false;finished=false;cur=null;done=new Set();cmp=0;swp=0;sweep=-1;play.textContent='Play';stats();}
  const seg=mk('div','seg');seg.style.gridColumn='1/-1';controls.append(seg);
  Object.keys(algoNames).forEach(k=>{const b=mk('button','',algoNames[k]);b.type='button';b.setAttribute('aria-pressed',k===algo?'true':'false');b.addEventListener('click',()=>{algo=k;$$('button',seg).forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');shuffle();});seg.append(b);});
  ctl(controls,{id:'ss',label:'Speed',min:2,max:60,value:14,fmt:v=>v+' steps/s',on:v=>{speed=v;}});
  const row=mk('div','btnrow');controls.append(row);
  const play=btn(row,'Play',()=>{
    if(finished)shuffle();
    if(!gen)gen=gens[algo](arr);
    playing=!playing;play.textContent=playing?'Pause':'Play';stats();
  },'btn');
  btn(row,'Shuffle',shuffle,'btn small ghost');
  shuffle();
  addCleanup(loop(dt=>{
    if(playing){acc+=dt*speed;while(acc>=1&&playing){acc-=1;const r=gen.next();if(r.done){playing=false;finished=true;cur=null;sweep=0;play.textContent='Play again';stats();break;}cur=r.value;}if(playing&&Math.random()<.2)stats();}

    st.fit();const ctx=st.ctx,w=st.w,h=st.h,pad=14,gap=4,bw=(w-pad*2-gap*(N-1))/N,top=26,base=h-14;

      if(done.has(i))c=mint;

      if(bw>20){ctx.fillStyle='#130F26';ctx.font='700 11px '+MONO;ctx.textAlign='center';ctx.fillText(arr[i],x+bw/2,base-bh+18);}
    }
    ctx.textAlign='left';ctx.font='700 11px '+MONO;ctx.fillStyle=amber;ctx.fillText('comparing',14,16);ctx.fillStyle=pink;ctx.fillText('swapping',100,16);ctx.fillStyle=mint;ctx.fillText('in place',180,16);
  }));
}

/* ===== shared helpers for the new visuals ===== */
const KC=()=>({b:col('--computer'),m:col('--chem'),p:col('--bio'),a:col('--phys'),fg:col('--fg'),card:col('--card'),line:col('--line'),ink:col('--ink')});
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function tx(ctx,s,x,y,o){o=o||{};ctx.font=(o.w||700)+' '+(o.s||12)+'px '+(o.f||MONO);ctx.fillStyle=o.c||'#F5F1FF';ctx.textAlign=o.a||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.textBaseline='alphabetic';}
function polyPoint(pts,t){let L=0;const ls=[];for(let i=0;i<pts.length-1;i++){const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);ls.push(d);L+=d;}let d=clamp(t,0,1)*L;for(let i=0;i<ls.length;i++){if(d<=ls[i]||i===ls.length-1){const u=ls[i]?clamp(d/ls[i],0,1):0;return [pts[i][0]+(pts[i+1][0]-pts[i][0])*u,pts[i][1]+(pts[i+1][1]-pts[i][1])*u];}d-=ls[i];}return pts[pts.length-1];}
function segment(parent,items,cur,on){const d=mk('div','seg');d.style.gridColumn='1/-1';items.forEach(it=>{const b=mk('button','',it[1]);b.type='button';b.setAttribute('aria-pressed',it[0]===cur?'true':'false');b.addEventListener('click',()=>{$$('button',d).forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');on(it[0]);});d.append(b);});parent.append(d);return d;}
function stepper(host,steps,opt){
  opt=opt||{};const api={i:0};
  const info=mk('div','info');info.setAttribute('aria-live','polite');
  const row=mk('div','btnrow');row.style.margin='14px 0';
  function show(){const s=steps[api.i];info.innerHTML='<h3>Step '+(api.i+1)+' of '+steps.length+': '+s.title+'</h3><p>'+s.text+'</p>';if(opt.on)opt.on(api.i);}
  api.set=function(n){api.i=((n%steps.length)+steps.length)%steps.length;show();};
  if(!opt.noBack)btn(row,'← Back',()=>api.set(api.i-1),'btn small ghost');
  btn(row,'Next step →',()=>api.set(api.i+1),'btn small');

}

function vCipher(host){

  function draw(){

    const used={};text.toUpperCase().split('').forEach(c=>{used[c]=1;});
    let a='<div class="alpha"><span class="rl">Plain</span>',b='<div class="alpha"><span class="rl">'+(mode==='enc'?'Coded':'Decoded')+'</span>';
    for(let i=0;i<26;i++){const L=String.fromCharCode(65+i);a+='<span class="'+(used[L]?'u':'')+'">'+L+'</span>';b+='<span class="'+(used[L]?'u':'')+'">'+map(L,sh)+'</span>';}
    alpha.innerHTML='<div style="min-width:640px">'+a+'</div>'+b+'</div></div>';
    all.hidden=!showAll;

  }

/* ---- Computer: binary search ---- */
function vBsearch(host){
  const N=32,arr=[];for(let i=0;i<N;i++)arr.push(3+i*3);
  let target,lo,hi,mid,guesses,found,msg;
  const info=mk('div','binout');host.append(info);
  const cg=mk('div','bsgrid');host.append(cg);
  const row=mk('div','btnrow');row.style.marginTop='16px';host.append(row);
  const read=mk('div','readout');host.append(read);
  const note=mk('div','note');host.append(note);
  cg.innerHTML=arr.map((v,i)=>'<div class="bc" data-i="'+i+'">'+v+'</div>').join('');
  const cells=$$('.bc',cg);
  function reset(newT){if(newT||target===undefined)target=arr[Math.floor(Math.random()*N)];lo=0;hi=N-1;mid=-1;guesses=0;found=false;msg='Press Step. Each guess is the middle of the numbers that are left.';draw();}
  function step(){if(found)return;mid=Math.floor((lo+hi)/2);guesses++;if(arr[mid]===target){found=true;msg='Found '+target+' in just '+guesses+' guesses.';}else if(arr[mid]<target){msg=arr[mid]+' is too low, so throw away the left half.';lo=mid+1;}else{msg=arr[mid]+' is too high, so throw away the right half.';hi=mid-1;}draw();}
  let timer=null;
  btn(row,'Step',step,'btn');
  const ab=btn(row,'Auto',()=>{if(timer){clearInterval(timer);timer=null;ab.textContent='Auto';}else{timer=setInterval(()=>{if(found){clearInterval(timer);timer=null;ab.textContent='Auto';}else step();},900);ab.textContent='Pause';}},'btn small ghost');
  btn(row,'New number',()=>{reset(true);},'btn small ghost');
  addCleanup(()=>{if(timer)clearInterval(timer);});
  function draw(){
    info.innerHTML='<div class="big"><small>Find this number</small>'+target+'</div>';
    cells.forEach((c,i)=>{c.className='bc'+(i<lo||i>hi?' out':'')+(i===mid?(found?' found':' mid'):'');});
    read.innerHTML=stat(guesses,'Guesses so far')+stat(found?1:Math.max(0,hi-lo+1),'Numbers left')+stat('up to 6','Needed for 32 numbers')+stat('up to 32','One by one');
    note.innerHTML=msg;
  }
  reset(true);
}

/* ---- Computer: CPU ---- */

  addCleanup(loop((dt,tm)=>{

function vLoops(host){

/* ---- Computer: strong passwords ---- */
function vPassword(host){
  const sets={lower:['abcdefghijklmnopqrstuvwxyz','Lowercase a–z'],upper:['ABCDEFGHIJKLMNOPQRSTUVWXYZ','Uppercase A–Z'],digit:['0123456789','Numbers 0–9'],sym:['!@#$%^&*()-_=+[]{};:,.?','Symbols !@#']};
  const on={lower:true,upper:false,digit:false,sym:false};let len=8,sample='';
  const controls=mk('div','controls');host.append(controls);
  ctl(controls,{id:'pwl',label:'Password length',min:4,max:24,value:8,fmt:v=>v+' characters',on:v=>{len=v;gen();upd();}});
  const row=mk('div','seg');row.style.gridColumn='1/-1';controls.append(row);
  Object.keys(sets).forEach(key=>{const b=mk('button','',sets[key][1]);b.type='button';b.setAttribute('aria-pressed',on[key]?'true':'false');b.addEventListener('click',()=>{const cnt=Object.keys(on).filter(x=>on[x]).length;if(on[key]&&cnt===1)return;on[key]=!on[key];b.setAttribute('aria-pressed',on[key]?'true':'false');gen();upd();});row.append(b);});
  const out=mk('div','pwout');host.append(out);
  const rb=mk('div','btnrow');rb.style.marginTop='14px';host.append(rb);btn(rb,'New random sample',()=>{gen();upd();},'btn small ghost');
  function pool(){return Object.keys(on).filter(x=>on[x]).map(x=>sets[x][0]).join('');}
  function gen(){const p=pool();let s='';const arr=new Uint32Array(len);try{crypto.getRandomValues(arr);}catch(e){for(let i=0;i<len;i++)arr[i]=Math.floor(Math.random()*4e9);}for(let i=0;i<len;i++)s+=p[arr[i]%p.length];sample=s;}
  function human(sec){if(sec<1)return 'less than a second';if(sec<60)return Math.round(sec)+' seconds';if(sec<3600)return Math.round(sec/60)+' minutes';if(sec<86400)return Math.round(sec/3600)+' hours';const d=sec/86400;if(d<365)return Math.round(d)+' days';const y=d/365.25;if(y<1000)return Math.round(y)+' years';if(y<1e6)return Math.round(y/1e3)+' thousand years';if(y<1e9)return Math.round(y/1e6)+' million years';if(y<1.38e10)return Math.round(y/1e9)+' billion years';return 'longer than the age of the universe';}
  function upd(){
    const p=pool().length,bits=len*Math.log2(p),sec=Math.pow(p,len)/2/1e10;
    const rate=bits<30?['Very weak',col('--bio')]:bits<45?['Weak',col('--bio')]:bits<60?['Okay',col('--phys')]:bits<80?['Strong',col('--chem')]:['Very strong',col('--chem')];
    out.innerHTML='<div class="pwsample">'+esc(sample)+'</div><div class="meter"><i style="width:'+clamp(bits/100,.04,1)*100+'%;background:'+rate[1]+'"></i></div><div class="readout">'+stat(rate[0],'Strength')+stat(p,'Characters to pick from')+stat(Math.round(bits)+' bits','Randomness')+stat(human(sec),'Time to crack')+'</div><div class="note">This assumes an attacker who tries 10 billion guesses every second, and who finds your password halfway through on average.</div>';
  }
  gen();upd();
}

  const parts=[];for(let i=0;i<90;i++)parts.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.14,vy:(Math.random()-.5)*.14});

/* ---- Chemistry: bonds ---- */
function vBonds(host){
  const k=KC();let type='ionic',target=0,p=0;
  const box=mk('div','stagebox');host.append(box);const st=stage(box,.55);
  const controls=mk('div','controls');host.append(controls);
  segment(controls,[['ionic','Ionic: Na + Cl'],['cov','Covalent: H + H']],type,v=>{type=v;target=0;p=0;txt();});
  const row=mk('div','btnrow');controls.append(row);
  const bb=btn(row,'Make the bond',()=>{target=target?0:1;bb.textContent=target?'Pull apart':'Make the bond';},'btn');
  const note=mk('div','note');host.append(note);
  function txt(){bb.textContent='Make the bond';note.innerHTML=type==='ionic'?'<b>Ionic bond.</b> Sodium has 1 outer electron and chlorine has 7. Sodium gives its electron to chlorine. Sodium becomes a positive ion, chlorine becomes a negative ion, and opposite charges attract. The result is sodium chloride, table salt.':'<b>Covalent bond.</b> Each hydrogen atom has 1 electron and wants 2 in its outer shell. They share, so both electrons orbit both nuclei. The shared pair holds the atoms together as a hydrogen molecule, H2.';}
  txt();
  addCleanup(loop((dt,tm)=>{
    p+=(target-p)*Math.min(1,dt*2.2);if(Math.abs(target-p)<.002)p=target;
    st.fit();const ctx=st.ctx,w=st.w,h=st.h,cy=h*.5;ctx.clearRect(0,0,w,h);
    const R=Math.min(w*.17,h*.3);
    function atom(x,r,colr,label,sub){ctx.strokeStyle=colr;ctx.lineWidth=3;ctx.setLineDash([5,6]);ctx.beginPath();ctx.arc(x,cy,r,0,6.3);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=colr;ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(x,cy,r*.45,0,6.3);ctx.fill();ctx.globalAlpha=1;tx(ctx,label,x,cy,{s:Math.max(12,r*.32),c:'#F5F1FF',w:800});if(sub)tx(ctx,sub,x,cy+r+22,{s:12,c:'#ABA3D1'});}
    function elec(x,y,c){ctx.save();ctx.shadowColor=c||k.m;ctx.shadowBlur=10;ctx.fillStyle=c||k.m;ctx.beginPath();ctx.arc(x,y,6,0,6.3);ctx.fill();ctx.restore();}
    const e=p*p*(3-2*p);
    if(type==='ionic'){
      const sep=w*(.24-.05*e),x1=w/2-sep,x2=w/2+sep,R2=R*1.12;
      atom(x1,R,k.a,'Na',e>.95?'Na+ ion':'sodium');atom(x2,R2,k.m,'Cl',e>.95?'Cl− ion':'chlorine');
      for(let n=0;n<8;n++){const a=n*Math.PI/4;if(n===4)continue;elec(x2+Math.cos(a)*R2,cy+Math.sin(a)*R2);}
      const sx=x1+R,ex=x2-R2;elec(sx+(ex-sx)*e,cy+Math.sin(tm*5)*2*(1-Math.abs(e*2-1)),k.p);
      if(e>.95){tx(ctx,'+',x1,cy-R-14,{s:22,c:k.a,w:800});tx(ctx,'−',x2,cy-R2-14,{s:22,c:k.m,w:800});tx(ctx,'opposite charges attract',w/2,h*.1,{s:12,c:k.fg});}
    }else{
      const sep=w*(.22-.1*e),x1=w/2-sep,x2=w/2+sep;
      atom(x1,R,k.b,'H',e>.95?'':'hydrogen');atom(x2,R,k.b,'H',e>.95?'':'hydrogen');
      const orb=(ph,s)=>[w/2+Math.cos(tm*3+ph)*R*.62,cy+Math.sin(tm*3+ph)*R*.42*s];
      const q1=orb(0,1),q2=orb(Math.PI,1),a1=[x1+R,cy],a2=[x2-R,cy];
      elec(a1[0]+(q1[0]-a1[0])*e,a1[1]+(q1[1]-a1[1])*e,k.p);elec(a2[0]+(q2[0]-a2[0])*e,a2[1]+(q2[1]-a2[1])*e,k.p);
      if(e>.95)tx(ctx,'H2: a shared pair of electrons',w/2,cy+R+24,{s:12,c:k.fg});
    }
  }));
}

/* ---- Chemistry: balancing equations ---- */
const EQS=[
 {name:'Making water',L:[{f:'H₂',a:{H:2}},{f:'O₂',a:{O:2}}],R:[{f:'H₂O',a:{H:2,O:1}}]},
 {name:'Making ammonia',L:[{f:'N₂',a:{N:2}},{f:'H₂',a:{H:2}}],R:[{f:'NH₃',a:{N:1,H:3}}]},
 {name:'Burning methane',L:[{f:'CH₄',a:{C:1,H:4}},{f:'O₂',a:{O:2}}],R:[{f:'CO₂',a:{C:1,O:2}},{f:'H₂O',a:{H:2,O:1}}]},
 {name:'Rusting iron',L:[{f:'Fe',a:{Fe:1}},{f:'O₂',a:{O:2}}],R:[{f:'Fe₂O₃',a:{Fe:2,O:3}}]}];
function vBalance(host){
  let eq=0,co=[];
  const controls=mk('div','controls');host.append(controls);
  segment(controls,EQS.map((e,i)=>[i,e.name]),0,v=>{eq=+v;reset();});
  const area=mk('div','eqarea');host.append(area);
  const beamBox=mk('div','beamwrap');host.append(beamBox);
  const tw=mk('div');tw.style.overflowX='auto';host.append(tw);
  const msg=mk('div','note');host.append(msg);
  function slots(){const E=EQS[eq];return E.L.concat(E.R);}
  function reset(){co=slots().map(()=>1);draw();}
  function tally(){const E=EQS[eq],L={},R={},nl=E.L.length;E.L.forEach((m,i)=>{Object.keys(m.a).forEach(el=>{L[el]=(L[el]||0)+m.a[el]*co[i];});});E.R.forEach((m,i)=>{Object.keys(m.a).forEach(el=>{R[el]=(R[el]||0)+m.a[el]*co[nl+i];});});return {L:L,R:R};}
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  function draw(){
    const E=EQS[eq],nl=E.L.length,all=slots();
    let h='<div class="eq">';

/* ---- Biology: natural selection ---- */
function vSelection(host){
  const k=KC(),N=40,FG={green:'#3F7A52',brown:'#7A5636'},BG={g:'#52B77B',b:'#A5703E'};
  let bg='green',pop=[],hist=[],gen=0,phase='idle',timer=0,auto=false,autoT=0,tm0=0;

  const row=mk('div','btnrow');controls.append(row);
  btn(row,'Next generation',()=>nextGen(),'btn');
  const ab=btn(row,'Auto run',()=>{auto=!auto;ab.textContent=auto?'Stop':'Auto run';},'btn small ghost');
  btn(row,'Reset',()=>reset(),'btn small ghost');
  const read=mk('div','readout');host.append(read);
  const sp=()=>({x:.04+Math.random()*.92,y:.06+Math.random()*.88});
  function reset(){pop=[];for(let i=0;i<N;i++){const q=sp();pop.push({x:q.x,y:q.y,c:i<N/2?'g':'b',a:1,eaten:false});}hist=[.5];gen=0;phase='idle';}
  function nextGen(){if(phase!=='idle')return;pop.forEach(b=>{const match=(bg==='green'&&b.c==='g')||(bg==='brown'&&b.c==='b');b.eaten=Math.random()<(match?.12:.55);});if(pop.filter(b=>!b.eaten).length<3){pop.forEach((b,i)=>{b.eaten=i>2?b.eaten:false;});}phase='eat';timer=0;}
  function born(){const sv=pop.filter(b=>!b.eaten),np=[];for(let i=0;i<N;i++){const par=sv[Math.floor(Math.random()*sv.length)];let c=par.c;if(Math.random()<.02)c=c==='g'?'b':'g';const q=sp();np.push({x:q.x,y:q.y,c:c,a:0,eaten:false});}pop=np;gen++;hist.push(pop.filter(b=>b.c==='g').length/N);phase='idle';}
  reset();

    if(auto&&phase==='idle'&&gen<40){autoT+=dt;if(autoT>.5){autoT=0;nextGen();}}

    pop.forEach(b=>{ctx.save();ctx.globalAlpha=b.a;ctx.translate(b.x*w,b.y*fh);ctx.fillStyle=BG[b.c];ctx.strokeStyle='rgba(19,15,38,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,0,9,6,0,0,6.3);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.stroke();if(b.eaten){ctx.strokeStyle=k.p;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-9,-9);ctx.lineTo(9,9);ctx.moveTo(9,-9);ctx.lineTo(-9,9);ctx.stroke();}ctx.restore();});
    if(phase==='eat'){const u=timer/1.1,bx=-40+u*(w+80),by=fh*.3+Math.sin(u*9)*14;ctx.strokeStyle='#F5F1FF';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx-18,by+Math.sin(tm*20)*8);ctx.quadraticCurveTo(bx-8,by-6,bx,by);ctx.quadraticCurveTo(bx+8,by-6,bx+18,by+Math.sin(tm*20)*8);ctx.stroke();}
    const cy0=fh+14,ch=h-fh-34,cx0=44,cw=w-cx0-14;ctx.fillStyle='#0F0B22';ctx.fillRect(0,fh,w,h-fh);
    ctx.strokeStyle=GRID;ctx.lineWidth=1;[0,.5,1].forEach(v=>{const y=cy0+ch*(1-v);ctx.beginPath();ctx.moveTo(cx0,y);ctx.lineTo(cx0+cw,y);ctx.stroke();tx(ctx,Math.round(v*100)+'%',cx0-6,y,{s:10,c:'#ABA3D1',a:'right'});});
    const mx=Math.max(10,hist.length-1);ctx.strokeStyle=BG.g;ctx.lineWidth=3;ctx.beginPath();hist.forEach((v,i)=>{const x=cx0+i/mx*cw,y=cy0+ch*(1-v);if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);});ctx.stroke();
    const lv=hist[hist.length-1];ctx.fillStyle=BG.g;ctx.beginPath();ctx.arc(cx0+(hist.length-1)/mx*cw,cy0+ch*(1-lv),5,0,6.3);ctx.fill();
    tx(ctx,'Share of green beetles in each generation',cx0,h-10,{s:10,c:'#ABA3D1',a:'left'});
    if(((tm*4)|0)!==tm0){tm0=(tm*4)|0;const g=pop.filter(b=>b.c==='g'&&!b.eaten).length,b2=pop.filter(b=>b.c==='b'&&!b.eaten).length;read.innerHTML=stat(gen,'Generation')+stat(g,'Green beetles')+stat(b2,'Brown beetles')+stat(phase==='eat'?'Bird hunting':'Waiting','Status');}
  }));

    const ex=cx+Math.cos(ang2)*rad(1),ey=cy+Math.sin(ang2)*rad(1);ctx.fillStyle=k.b;ctx.beginPath();ctx.arc(ex,ey,7,0,6.3);ctx.fill();tx(ctx,'Earth',ex,ey-16,{s:10,c:k.b});
    ctx.save();ctx.shadowColor=k.p;ctx.shadowBlur=14;ctx.fillStyle=k.p;ctx.beginPath();ctx.arc(px,py,9,0,6.3);ctx.fill();ctx.restore();tx(ctx,'Your planet',px,py-18,{s:10,c:k.p});

/* ---- Physics: friction on a ramp ---- */
function vIncline(host){
  const k=KC();let ang=20,mu=.3,s=null,v=0,slide=false,wait=0;const MU={Ice:.05,Wood:.3,Rubber:.8};let surf='Wood';
  const box=mk('div','stagebox');host.append(box);const st=stage(box,.62);
  const controls=mk('div','controls');host.append(controls);
  ctl(controls,{id:'ia',label:'Ramp angle',min:0,max:60,value:20,fmt:v=>v+'°',on:v=>{ang=v;put();}});
  segment(controls,Object.keys(MU).map(x=>[x,x+' '+MU[x]]),surf,x=>{surf=x;mu=MU[x];put();});
  const row=mk('div','btnrow');controls.append(row);btn(row,'Put the block back',()=>put(),'btn small');
  const read=mk('div','readout');host.append(read);let tm0=0;
  const g=9.8;function put(){s=null;v=0;slide=false;wait=0;}
  addCleanup(loop((dt,tm)=>{
    st.fit();const ctx=st.ctx,w=st.w,h=st.h;ctx.clearRect(0,0,w,h);
    const th=ang*Math.PI/180,x0=w*.08,yb=h*.88,Lr=Math.min(w*.82/Math.max(Math.cos(th),.45),h*.8/Math.max(Math.sin(th),.3),w*.8);
    const ux=Math.cos(th),uy=-Math.sin(th),nx=-Math.sin(th),ny=-Math.cos(th);
    if(s===null)s=Lr*.78;
    const slides=Math.tan(th)>mu,a=slides?g*(Math.sin(th)-mu*Math.cos(th)):0;
    if(slides){v+=a*dt*.9;s-=v*dt*14;if(s<=0){s=0;wait+=dt;if(wait>1)put();}}else{v=0;}
    ctx.fillStyle='#2A2350';ctx.strokeStyle=k.a;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x0,yb);ctx.lineTo(x0+Lr*ux,yb);ctx.lineTo(x0+Lr*ux,yb+uy*Lr);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='#F5F1FF';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0-20,yb);ctx.lineTo(w,yb);ctx.stroke();
    const bs=Math.min(w,h)*.09;const sx=x0+ux*s,sy=yb+uy*s,cx=sx+nx*bs/2,cy=sy+ny*bs/2;
    ctx.save();ctx.translate(sx,sy);ctx.rotate(-th);ctx.fillStyle=k.b;ctx.strokeStyle='#130F26';ctx.lineWidth=2;ctx.fillRect(-bs/2,-bs,bs,bs);ctx.strokeRect(-bs/2,-bs,bs,bs);ctx.restore();
    const K=Math.min(w,h)*.012;
    function arr(dx,dy,c,lab){const x2=cx+dx*K,y2=cy+dy*K,len=Math.hypot(dx,dy)*K;if(len<4)return;ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x2,y2);ctx.stroke();const an=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-11*Math.cos(an-.5),y2-11*Math.sin(an-.5));ctx.lineTo(x2-11*Math.cos(an+.5),y2-11*Math.sin(an+.5));ctx.fill();tx(ctx,lab,x2+Math.cos(an)*14,y2+Math.sin(an)*14,{s:10,c:c});}
    const Wt=g,along=Wt*Math.sin(th),fr=Math.min(mu*Wt*Math.cos(th),along);
    arr(0,Wt,k.p,'weight');arr(nx*Wt*Math.cos(th),ny*Wt*Math.cos(th),k.m,'support');arr(-ux*along,-uy*along,k.a,'slide pull');arr(ux*fr,uy*fr,'#F5F1FF','friction');
    if(((tm*5)|0)!==tm0){tm0=(tm*5)|0;read.innerHTML=stat(along.toFixed(1)+' N','Pull down the slope (1 kg block)')+stat((mu*Wt*Math.cos(th)).toFixed(1)+' N','Most friction can give')+stat(slides?'Slides':'Stays put','Result')+stat(slides?a.toFixed(2)+' m/s²':'0','Acceleration')+stat((Math.atan(mu)*180/Math.PI).toFixed(1)+'°','Angle where it starts to slide');}
  }));
}

/* ---- Physics: Doppler effect ---- */
function vDoppler(host){
  const k=KC();let M=.5,waves=[],x=0,tEm=0,ac=null;
  const box=mk('div','stagebox');host.append(box);const st=stage(box,.5);
  const controls=mk('div','controls');host.append(controls);
  ctl(controls,{id:'dm',label:'Source speed (1.0 = speed of sound)',min:0,max:1.5,step:.05,value:.5,fmt:v=>v.toFixed(2),on:v=>{M=v;waves=[];x=0;}});
  const row=mk('div','btnrow');controls.append(row);
  const beep=f=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.6);}catch(e){}};
  btn(row,'Hear it ahead',()=>beep(Math.min(1800,440/Math.max(.2,1-M))),'btn small');
  btn(row,'Hear it behind',()=>beep(440/(1+M)),'btn small ghost');
  addCleanup(()=>{try{if(ac)ac.close();}catch(e){}});
  const read=mk('div','readout');host.append(read);const note=mk('div','note');host.append(note);let tm0=0;
  addCleanup(loop((dt,tm)=>{
    st.fit();const ctx=st.ctx,w=st.w,h=st.h,cy=h/2,c=120;ctx.clearRect(0,0,w,h);
    const vs=M*c;if(M<.02)x=w*.5;else{if(x<w*.12)x=w*.12;x+=vs*dt;if(x>w*.85){x=w*.12;waves=[];}}
    tEm+=dt;if(tEm>.3){tEm=0;waves.push({x:x,r:0});if(waves.length>40)waves.shift();}
    waves.forEach(q=>{q.r+=c*dt;});
    waves.forEach(q=>{ctx.strokeStyle='rgba(91,140,255,'+clamp(1-q.r/(w*.7),.05,.8)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(q.x,cy,q.r,0,6.3);ctx.stroke();});
    if(M>1){const sa=Math.asin(1/M),L=w;ctx.strokeStyle=k.p;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-Math.cos(sa)*L,cy-Math.sin(sa)*L);ctx.lineTo(x,cy);ctx.lineTo(x-Math.cos(sa)*L,cy+Math.sin(sa)*L);ctx.stroke();}
    ctx.save();ctx.shadowColor=k.a;ctx.shadowBlur=14;ctx.fillStyle=k.a;ctx.beginPath();ctx.arc(x,cy,12,0,6.3);ctx.fill();ctx.restore();
    ctx.fillStyle=k.m;ctx.beginPath();ctx.arc(w-22,cy,8,0,6.3);ctx.fill();tx(ctx,'listener ahead',w-22,cy-20,{s:10,c:k.m,a:'right'});ctx.fillStyle=k.b;ctx.beginPath();ctx.arc(22,cy,8,0,6.3);ctx.fill();tx(ctx,'listener behind',22,cy-20,{s:10,c:k.b,a:'left'});
    if(((tm*4)|0)!==tm0){tm0=(tm*4)|0;const ah=M>=.95?'shock wave':Math.round(440/(1-M))+' Hz',bh=Math.round(440/(1+M))+' Hz';read.innerHTML=stat('440 Hz','Pitch the source makes')+stat(ah,'Heard ahead')+stat(bh,'Heard behind');note.innerHTML=M>=1?'<b>Faster than sound.</b> The waves cannot get ahead of the source. They pile up into a cone, the shock wave that you hear as a sonic boom.':'Ahead of the source the waves are squeezed together, so the pitch is higher. Behind it they are stretched, so the pitch is lower.';}
  }));
}
