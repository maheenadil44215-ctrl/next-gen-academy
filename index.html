/* ================= VOICE ================= */
let speaking=false,speakRun=0;
function stopSpeak(){speakRun++;speaking=false;try{if('speechSynthesis' in window)window.speechSynthesis.cancel();}catch(e){}
  $$('.wave').forEach(w=>w.classList.remove('on'));$$('.transcript span').forEach(s=>s.classList.remove('now'));
  const b=$('#voiceBtn');if(b)b.textContent='Play voice note';}
function splitSentences(s){const out=[];let cur='';for(let i=0;i<s.length;i++){cur+=s[i];if('.!?'.indexOf(s[i])>-1&&(i===s.length-1||s[i+1]===' ')){out.push(cur.trim());cur='';}}if(cur.trim())out.push(cur.trim());return out;}
function scriptOf(t){
  const parts=[t.title+'.'];
  t.explain.forEach(x=>{parts.push(x.h.replace(/[.!?]$/,'')+'.');parts.push(x.t);});
  parts.push('In one line. '+t.tldr);return parts.join(' ');
}
function panelVoice(host,t){
  const sents=splitSentences(scriptOf(t));
  const bars=[];for(let i=0;i<34;i++)bars.push('<span style="--i:'+i+';--h:'+(0.25+Math.abs(Math.sin(i*1.3))*0.6).toFixed(2)+'"></span>');
  host.innerHTML='<div class="voice"><div class="player"><button class="btn" id="voiceBtn" type="button">Play voice note</button><div class="wave" aria-hidden="true">'+bars.join('')+'</div><label for="vrate" class="small-note">Speed</label><select id="vrate"><option value="0.85">Slow</option><option value="1" selected>Normal</option><option value="1.2">Fast</option></select></div>'
   +'<p class="hint">Tap any sentence to start from there. Voice uses your device\'s built in English voice.</p>'
   +'<div class="transcript" id="transcript">'+sents.map((s,i)=>'<span data-i="'+i+'">'+esc(s)+'</span>').join(' ')+'</div></div>';
  const supported='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
  const wave=$('.wave',host),btnEl=$('#voiceBtn',host);
  if(!supported){btnEl.disabled=true;btnEl.textContent='Voice not supported here';return;}
  function pickVoice(){let vs=[];try{vs=window.speechSynthesis.getVoices();}catch(e){}return vs.filter(v=>/^en/i.test(v.lang))[0]||null;}
  function say(i,run){
    if(run!==speakRun)return;
    if(i>=sents.length){stopSpeak();return;}
    const u=new SpeechSynthesisUtterance(sents[i]);u.rate=+$('#vrate',host).value;u.lang='en-US';const v=pickVoice();if(v)u.voice=v;
    u.onstart=()=>{if(run!==speakRun)return;$$('.transcript span',host).forEach(s=>s.classList.toggle('now',+s.dataset.i===i));};
    u.onend=()=>say(i+1,run);u.onerror=()=>{if(run===speakRun)stopSpeak();};
    try{window.speechSynthesis.speak(u);}catch(e){stopSpeak();}
  }
  function start(i){stopSpeak();const run=speakRun;speaking=true;wave.classList.add('on');btnEl.textContent='Stop';say(i,run);}
  btnEl.addEventListener('click',()=>{if(speaking)stopSpeak();else start(0);});
  $$('.transcript span',host).forEach(s=>s.addEventListener('click',()=>start(+s.dataset.i)));
}

/* ================= QUIZ ENGINE ================= */
function runQuiz(host,o){
  const qs=o.questions;let i=0,score=0,answered=false;
  function render(){
    const q=qs[i];answered=false;
    host.innerHTML='<div class="qhead"><span>Question '+(i+1)+' of '+qs.length+'</span><div class="qbar"><i style="width:'+(i/qs.length*100)+'%"></i></div></div>'
     +'<h3 class="qtext">'+q.q+'</h3><div class="opts">'+q.o.map((x,k)=>'<button class="opt" type="button" data-k="'+k+'"><span class="key">'+'ABCD'[k]+'</span><span>'+x+'</span></button>').join('')+'</div><div class="fb" aria-live="polite"></div><div class="qfoot"></div>';
    $$('.opt',host).forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.k)));
  }
  function pick(k){
    if(answered)return;answered=true;const q=qs[i],ok=k===q.a;if(ok)score++;
    $$('.opt',host).forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('right');else if(j===k)b.classList.add('wrong');});
    const fb=$('.fb',host);fb.className='fb '+(ok?'ok':'no');fb.textContent=(ok?'Correct. ':'Not quite. ')+q.why;
    const nx=btn($('.qfoot',host),i<qs.length-1?'Next question':'See my score',()=>{if(i<qs.length-1){i++;render();}else finish();},'btn');nx.focus();
  }
  function finish(){
    const prev=o.best[o.id]||0,gain=Math.max(0,score-prev)*10;
    if(gain>0||score>prev){S.best[o.id]=Math.max(prev,score);S.xp+=gain;}
    if(o.topic&&score>=2)S.done[o.id]=true;
    save();const pill=$('#xpPill');if(pill)pill.textContent='Lv '+level()+' · '+S.xp+' XP';
    const perfect=score===qs.length,msg=perfect?'Perfect run. You really know this.':(score>=qs.length/2?'Solid. One more try and you will have it.':'Good start. Read the Understand tab and try again.');
    host.innerHTML='<div class="card result"><div class="burst"></div><p class="eyebrow">Your score</p><div class="score">'+score+'/'+qs.length+'</div><p>'+msg+'</p>'+(gain>0?'<span class="xp">+'+gain+' XP</span>':'<p class="small-note">XP is only added when you beat your best score.</p>')+'<div class="btnrow"></div></div>';
    const row=$('.btnrow',host);btn(row,'Try again',()=>{i=0;score=0;render();},'btn');if(o.after)o.after(row);
    if(perfect){const bz=$('.burst',host),cs=['--computer','--chem','--bio','--phys'];for(let k=0;k<30;k++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background='var('+cs[k%4]+')';p.style.animationDelay=(Math.random()*.6)+'s';bz.append(p);}}
  }
  render();
}

const app=$('#app');
let nav={view:'login'};
function go(view,p){runCleanups();nav=Object.assign({view:view},p||{});render();window.scrollTo(0,0);}

/* ---- free, hand drawn SVG illustrations (no images, no cost) ---- */
const st_=(c,w)=>'fill="none" style="stroke:var(--'+c+');stroke-width:'+(w||3)+';stroke-linecap:round;stroke-linejoin:round"';
const fl_=(c,o)=>'style="fill:var(--'+c+');'+(o?'opacity:'+o:'')+'"';
function illComputer(){
  let lines='';[[104,48,60,'chem'],[104,62,90,'computer'],[118,76,52,'phys'],[118,90,74,'bio'],[104,104,40,'computer']].forEach(l=>{lines+='<rect x="'+l[0]+'" y="'+l[1]+'" width="'+l[2]+'" height="7" rx="3.5" '+fl_(l[3])+'/>';});
  const dg=[[34,52,'1',0],[52,118,'0',.8],[262,46,'0',1.4],[280,110,'1',.4],[246,138,'1',2],[24,100,'0',1.1]].map(d=>'<text class="ill-float" x="'+d[0]+'" y="'+d[1]+'" font-size="22" font-weight="800" font-family="monospace" style="fill:var(--chem);opacity:.7;animation-delay:-'+d[3]+'s">'+d[2]+'</text>').join('');
  return '<svg viewBox="0 0 320 170" role="img" aria-label="Laptop with code and binary digits"><circle cx="160" cy="84" r="72" '+fl_('computer',.14)+'/><rect x="86" y="26" width="148" height="98" rx="10" style="fill:#0F0B22;stroke:var(--computer);stroke-width:4"/>'+lines+'<text x="188" y="108" font-size="20" font-weight="800" font-family="monospace" '+fl_('computer')+'>{ }</text><path d="M66 132 h188 l-16 14 h-156 z" '+fl_('computer')+'/>'+dg+'</svg>';
}
function illChem(){
  return '<svg viewBox="0 0 320 170" role="img" aria-label="Flask with bubbles and a molecule"><circle cx="160" cy="88" r="72" '+fl_('chem',.14)+'/><path d="M146 20 h28 v38 l40 70 a14 14 0 0 1 -12 21 h-84 a14 14 0 0 1 -12 -21 l40 -70 z" style="fill:#0F0B22;stroke:var(--chem);stroke-width:4;stroke-linejoin:round"/><path d="M117 116 q21 -9 43 0 t43 0 l12 22 a8 8 0 0 1 -7 12 h-96 a8 8 0 0 1 -7 -12 z" '+fl_('chem',.55)+'/>'
   +'<circle class="ill-rise" cx="146" cy="128" r="5" '+fl_('fg')+'/><circle class="ill-rise" style="animation-delay:-1.2s;fill:var(--fg)" cx="170" cy="124" r="4"/><circle class="ill-rise" style="animation-delay:-2.3s;fill:var(--fg)" cx="158" cy="132" r="6"/>'
   +'<g class="ill-float"><polygon points="262,44 282,56 282,80 262,92 242,80 242,56" '+st_('bio',3)+'/>'+[[262,44],[282,56],[282,80],[262,92],[242,80],[242,56]].map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="6" '+fl_(['phys','computer','bio'][i%3])+'/>').join('')+'</g>'
   +'<rect x="40" y="46" width="22" height="80" rx="11" style="fill:#0F0B22;stroke:var(--phys);stroke-width:4"/><rect x="44" y="84" width="14" height="38" rx="7" '+fl_('bio',.8)+'/></svg>';
}
function illBio(){
  let a='',b='',r='';const cols=['bio','phys','chem','computer'];
  for(let x=44;x<=276;x+=4){const y1=84+34*Math.sin((x-44)/232*Math.PI*4),y2=84-34*Math.sin((x-44)/232*Math.PI*4);a+=(x===44?'M':'L')+x+' '+y1.toFixed(1)+' ';b+=(x===44?'M':'L')+x+' '+y2.toFixed(1)+' ';}
  for(let i=0;i<14;i++){const x=52+i*16.5,y1=84+34*Math.sin((x-44)/232*Math.PI*4),y2=84-34*Math.sin((x-44)/232*Math.PI*4);r+='<line x1="'+x+'" y1="'+y1.toFixed(1)+'" x2="'+x+'" y2="'+y2.toFixed(1)+'" '+st_(cols[i%4],3)+'/>';}
  return '<svg viewBox="0 0 320 170" role="img" aria-label="DNA double helix with a cell and a leaf"><circle cx="160" cy="84" r="72" '+fl_('bio',.14)+'/>'+r+'<path d="'+a+'" '+st_('fg',5)+'/><path d="'+b+'" '+st_('bio',5)+'/>'
   +'<g class="ill-float"><circle cx="278" cy="38" r="22" style="fill:#0F0B22;stroke:var(--bio);stroke-width:3"/><circle cx="283" cy="34" r="8" '+fl_('computer')+'/><circle cx="272" cy="46" r="3" '+fl_('chem')+'/></g>'
   +'<g class="ill-float" style="animation-delay:-2s"><path d="M24 140 C24 104 54 90 80 94 C80 128 56 150 24 140 Z" '+fl_('chem',.85)+'/><path d="M26 138 L66 104" '+st_('ink',2)+'/></g></svg>';
}
function illPhys(){
  const orb=[0,60,120].map((a,i)=>'<ellipse cx="160" cy="80" rx="70" ry="26" transform="rotate('+a+' 160 80)" '+st_('phys',3)+' opacity=".75"/><circle cx="'+(160+70)+'" cy="80" r="6" transform="rotate('+a+' 160 80)" '+fl_(['bio','chem','computer'][i])+'/>').join('');
  let w='M16 150';for(let i=0;i<10;i++)w+=' q15 -20 30 0 t30 0'.replace(' t30 0','')+(i%2?'':'');
  let wave='M16 150 ';for(let i=0;i<10;i++)wave+=(i===0?'q15 -22 30 0':'t30 0')+' ';
  return '<svg viewBox="0 0 320 170" role="img" aria-label="Atom with orbits and a wave"><circle cx="160" cy="80" r="72" '+fl_('phys',.14)+'/><g class="ill-spin" style="transform-origin:160px 80px">'+orb+'</g><circle cx="160" cy="80" r="11" '+fl_('phys')+'/><path d="'+wave+'" '+st_('computer',3)+' opacity=".8"/><circle class="ill-float" cx="40" cy="38" r="9" '+fl_('bio')+'/><circle class="ill-float" cx="288" cy="32" r="6" style="fill:var(--chem);animation-delay:-1.5s"/></svg>';
}
const ILL={computer:illComputer,chemistry:illChem,biology:illBio,physics:illPhys};

const mega=sm=>'<h1 class="mega'+(sm?' '+sm:'')+'"><span class="m1">The Next</span> <span class="m2">Gen</span> <span class="m3">Academy</span></h1>';
const tagline='<p class="tagline">See it. Hear it. <b>Get it.</b></p>';
const logoPlate='<div class="logoplate"><img src="'+LOGO_FULL+'" alt="Next Gen Academy logo, made by Maheen Adil"></div>';
const firstName=()=>esc((S.user&&S.user.name||'friend').trim().split(/\s+/)[0]);
const footer=()=>'<p class="foot">The Next Gen Academy · made by Maheen Adil</p>';

function topbar(){
  return '<header class="top"><button class="brand" type="button" data-go="home" aria-label="Go to home"><span class="tree"><img src="'+LOGO_TREE+'" alt=""></span><span class="wm">The Next Gen<br>Academy</span></button>'
   +'<div class="top-r"><span class="pill" id="xpPill">Lv '+level()+' · '+S.xp+' XP</span><span class="pill hot">'+S.streak+' day streak</span><button class="btn ghost small" type="button" data-act="logout">Log out</button></div></header>';
}
function bindCommon(){
  $$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  $$('[data-act=logout]').forEach(b=>b.addEventListener('click',()=>{S.user=null;save();go('login');}));
}

function viewLogin(){
  app.innerHTML='<section class="hero">'+mega('')+tagline+'<p class="byline">Computer · Chemistry · Biology · Physics · made by Maheen Adil</p></section>'
   +'<main class="split" style="min-height:0"><form class="card stack" id="loginForm" novalidate><p class="eyebrow">Log in to start</p><h2>Your name and email</h2>'
   +'<label for="uName">Your name</label><input id="uName" type="text" autocomplete="name" placeholder="Maheen" maxlength="40">'
   +'<label for="uMail">Email</label><input id="uMail" type="email" autocomplete="email" placeholder="you@example.com" maxlength="80">'
   +'<p class="err" id="loginErr" role="alert"></p><button class="btn" type="submit">Log in</button><p class="small-note">Your progress is saved on this device.</p></form>'+logoPlate+'</main>';
  $('#loginForm').addEventListener('submit',e=>{
    e.preventDefault();const name=$('#uName').value.trim(),mail=$('#uMail').value.trim(),err=$('#loginErr');
    if(name.length<2){err.textContent='Please enter your name.';$('#uName').focus();return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){err.textContent='That email does not look right. Try name@example.com.';$('#uMail').focus();return;}
    if(S.user&&S.user.email!==mail){S.xp=0;S.done={};S.best={};S.streak=0;S.lastDay='';}
    S.user={name:name,email:mail};touchStreak();save();go('welcome');
  });
}
function viewWelcome(){
  app.innerHTML=topbar()+'<section class="hero">'+mega('')+tagline+'</section><main class="split" style="min-height:0"><div><p class="eyebrow">Welcome</p><h2>Hey '+firstName()+', ready to level up?</h2><p class="lead">Pick a subject, play with the visuals, listen to the voice notes and test yourself. Every correct answer earns XP.</p>'
   +'<div class="stats3"><div class="stat"><b>Lv '+level()+'</b><span>Level</span></div><div class="stat"><b>'+S.xp+'</b><span>XP</span></div><div class="stat"><b>'+S.streak+'</b><span>Day streak</span></div></div>'
   +'<button class="btn" type="button" data-go="home">Start learning</button><div class="chips">'+SUBJECTS.map(s=>'<span class="chip" style="--c:'+s.color+'">'+s.name+' · '+s.topics.length+' topics</span>').join('')+'</div></div>'+logoPlate+'</main>'+footer();
  bindCommon();
}
function progress(s){const d=s.topics.filter(t=>S.done[t.id]).length;return {d:d,n:s.topics.length};}
function viewHome(){
  app.innerHTML=topbar()+'<section class="hero herorow"><div>'+mega('md')+tagline+'<p class="lead">Four subjects, '+SUBJECTS.reduce((a,s)=>a+s.topics.length,0)+' topics. Every topic has a live visual, a full explanation, a voice note and a quiz.</p></div>'+logoPlate+'</section><div class="grid-subj">'
   +SUBJECTS.map(s=>{const p=progress(s);return '<button class="scard" type="button" data-sid="'+s.id+'" style="--ac:'+s.color+'"><div class="illus">'+ILL[s.id]()+'</div><h3>'+s.name+'</h3><p class="slogan">'+s.slogan+'</p><p>'+s.blurb+'</p><div class="bar"><i style="width:'+(p.d/p.n*100)+'%"></i></div><span class="meta">'+p.d+' of '+p.n+' topics done · '+s.topics.length+' topics</span><span class="go">Explore '+s.name+' →</span></button>';}).join('')
   +'</div>'+footer();
  bindCommon();$$('[data-sid]').forEach(b=>b.addEventListener('click',()=>go('subject',{sid:b.dataset.sid})));
}
function viewSubject(){
  const s=subj(nav.sid),p=progress(s),arenaBest=S.best['arena-'+s.id];
  app.innerHTML=topbar()+'<main style="--ac:'+s.color+'"><button class="back" type="button" data-go="home">← All subjects</button><section class="sbanner"><div><p class="eyebrow">'+s.tag+'</p><h1>'+s.name+'</h1><p class="slogan" style="font-size:1.2rem;margin-top:10px">'+s.slogan+'</p><p class="lead">'+s.blurb+'</p></div><div class="illus">'+ILL[s.id]()+'</div></section>'
   +'<h2 class="h2">'+s.topics.length+' topics · '+p.d+' done</h2><div class="grid-topics">'
   +s.topics.map(t=>'<button class="tcard" type="button" data-tid="'+t.id+'"><div class="trow"><span class="tg">'+esc(t.g||s.glyph)+'</span><span class="tag'+(S.done[t.id]?' done':'')+'">'+(S.done[t.id]?'Completed':t.kind)+'</span></div><h3>'+t.title+'</h3><p class="small-note" style="font-size:1rem">'+t.sub+'</p><span class="meta">Visualize · Understand · Voice note · Quiz</span><span class="go">Open topic →</span></button>').join('')
   +'</div><h2 class="h2">Quiz arena</h2><div class="card arena"><div><h3>10 random '+s.name+' questions</h3><p>Pulled from all '+s.topics.length+' topics, so it is different every time. '+(arenaBest!=null?'Your best: '+arenaBest+'/10.':'Not played yet.')+'</p></div><button class="btn" type="button" id="arenaGo">Start the arena</button></div></main>'+footer();
  bindCommon();
  $$('[data-tid]').forEach(b=>b.addEventListener('click',()=>go('topic',{sid:s.id,tid:b.dataset.tid,tab:'visual'})));
  $('#arenaGo').addEventListener('click',()=>go('arena',{sid:s.id}));
}
function viewArena(){
  const s=subj(nav.sid);let pool=[];s.topics.forEach(t=>t.quiz.forEach(q=>pool.push(q)));pool=shuffled(pool).slice(0,10);
  app.innerHTML=topbar()+'<main style="--ac:'+s.color+'"><button class="back" type="button" id="backS">← Back to '+s.name+'</button><p class="eyebrow">Quiz arena</p><h1>'+s.name+' challenge</h1><div class="quiz" id="quizHost"></div></main>'+footer();
  bindCommon();$('#backS').addEventListener('click',()=>go('subject',{sid:s.id}));
  runQuiz($('#quizHost'),{id:'arena-'+s.id,questions:pool,best:S.best,topic:false,after:row=>btn(row,'Back to '+s.name,()=>go('subject',{sid:s.id}),'btn small ghost')});
}
function viewTopic(){
  const s=subj(nav.sid),t=topicOf(nav.sid,nav.tid),ti=s.topics.indexOf(t);
  const tabs=[['visual','Visualize'],['explain','Understand'],['voice','Voice note'],['quiz','Quiz']];
  app.innerHTML=topbar()+'<main style="--ac:'+s.color+'"><button class="back" type="button" id="backS">← '+s.name+'</button><p class="eyebrow">'+s.name+' · topic '+(ti+1)+' of '+s.topics.length+'</p><h1>'+t.title+'</h1><p class="lead">'+t.sub+'</p>'
   +'<div class="tabs" role="tablist" aria-label="Topic sections">'+tabs.map(x=>'<button class="tab" role="tab" type="button" data-tab="'+x[0]+'" aria-selected="false">'+x[1]+'</button>').join('')+'</div><div id="panel" role="tabpanel"></div>'
   +'<div class="tnav"><span>'+(ti>0?'<button class="btn ghost small" type="button" id="prevT">← '+esc(s.topics[ti-1].title)+'</button>':'')+'</span><span>'+(ti<s.topics.length-1?'<button class="btn small" type="button" id="nextT">'+esc(s.topics[ti+1].title)+' →</button>':'')+'</span></div></main>'+footer();
  bindCommon();$('#backS').addEventListener('click',()=>go('subject',{sid:s.id}));
  if($('#prevT'))$('#prevT').addEventListener('click',()=>go('topic',{sid:s.id,tid:s.topics[ti-1].id,tab:'visual'}));
  if($('#nextT'))$('#nextT').addEventListener('click',()=>go('topic',{sid:s.id,tid:s.topics[ti+1].id,tab:'visual'}));
  function show(tab){
    runCleanups();nav.tab=tab;
    $$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));
    const host=$('#panel');host.innerHTML='';
    if(tab==='visual'){host.append(mk('p','hint','<b>Try it.</b> '+t.try));const v=mk('div');host.append(v);VIS[t.vis](v);}
    else if(tab==='explain'){host.innerHTML='<div class="explain">'+t.explain.map(x=>'<article class="ex"><h3>'+x.h+'</h3><p>'+x.t+'</p></article>').join('')+'</div><div class="tldr"><b>In one line</b><p>'+t.tldr+'</p></div><div class="fact"><b>Did you know?</b><p>'+t.fact+'</p></div>';}
    else if(tab==='voice'){panelVoice(host,t);}
    else{const q=mk('div','quiz');host.append(q);runQuiz(q,{id:t.id,questions:t.quiz,best:S.best,topic:true,after:row=>{btn(row,'Back to topics',()=>go('subject',{sid:s.id}),'btn small ghost');}});}
  }
  $$('.tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
  show(nav.tab||'visual');
}

function render(){
  if(nav.view!=='login'&&nav.view!=='welcome'&&!S.user){nav={view:'login'};}
  ({login:viewLogin,welcome:viewWelcome,home:viewHome,subject:viewSubject,arena:viewArena,topic:viewTopic})[nav.view]();
}

load();
if(S.user){touchStreak();nav={view:'welcome'};}
render();
})();
</script>

</body>
</html>
